<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>PokéScout Login</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f7f9; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 320px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #20558a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
        h2 { text-align: center; color: #333; }
    </style>
</head>
<body>
    <div class="card">
        <h2>PokéScout Login</h2>
        <form id="loginForm">
            <input type="email" id="email" placeholder="E-Mail" required>
            <input type="password" id="password" placeholder="Passwort" required>
            <button type="submit">Einloggen</button>
        </form>
        <p id="error" style="color: red; font-size: 12px; text-align: center; display: none;"></p>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            if (data.token) {
                localStorage.setItem('userToken', data.token);
                window.location.href = "/index.html"; // Weiterleitung nach Erfolg
            } else {
                const err = document.getElementById('error');
                err.innerText = data.error || "Login fehlgeschlagen";
                err.style.display = "block";
            }
        };
    </script>
</body>
</html>
