<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Pro - Login</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #20558a; margin-bottom: 25px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #e1e8ed; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #20558a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 20px; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        .toggle-link { margin-top: 20px; font-size: 14px; color: #657786; cursor: pointer; }
        .toggle-link b { color: #20558a; }
        #message { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 14px; display: none; line-height: 1.4; }
        .error { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; display: block !important; }
        .success { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; display: block !important; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="form-title">Anmelden</h2>
    <form id="auth-form">
        <input type="email" id="email" placeholder="E-Mail Adresse" required>
        <input type="password" id="password" placeholder="Passwort" required>
        <button type="submit" id="submit-btn">Login</button>
    </form>
    
    <div id="message"></div>
    
    <div class="toggle-link" id="toggle-auth">
        Noch kein Account? <b>Jetzt registrieren</b>
    </div>
</div>

<script>
    const form = document.getElementById('auth-form');
    const title = document.getElementById('form-title');
    const btn = document.getElementById('submit-btn');
    const toggle = document.getElementById('toggle-auth');
    const message = document.getElementById('message');
    
    let isLoginMode = true;

    toggle.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        title.innerText = isLoginMode ? "Anmelden" : "Registrieren";
        btn.innerText = isLoginMode ? "Login" : "Konto erstellen";
        toggle.innerHTML = isLoginMode ? "Noch kein Account? <b>Jetzt registrieren</b>" : "Bereits ein Konto? <b>Zum Login</b>";
        message.style.display = 'none';
        form.reset();
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const endpoint = isLoginMode ? '/login' : '/register';

        try {
            btn.disabled = true;
            btn.innerText = "Verarbeite...";
            message.style.display = 'none';

            const response = await fetch(`https://pokecardscout-api.onrender.com${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                if (isLoginMode) {
                    localStorage.setItem('poketool_token', data.token);
                    message.className = "success";
                    message.innerText = "Erfolgreich eingeloggt! Du wirst weitergeleitet...";
                    setTimeout(() => window.location.href = "index.html", 1000);
                } else {
                    message.className = "success";
                    message.innerText = "Konto erstellt! Du kannst dich jetzt einloggen.";
                    setTimeout(() => toggle.click(), 2000);
                }
            } else {
                // Hier wird die spezifische Fehlermeldung vom Server angezeigt
                message.className = "error";
                message.innerText = data.error || "Ein unbekannter Fehler ist aufgetreten.";
                btn.disabled = false;
                btn.innerText = isLoginMode ? "Login" : "Konto erstellen";
            }
        } catch (err) {
            message.className = "error";
            message.innerText = "Server nicht erreichbar. Bitte später versuchen.";
            btn.disabled = false;
            btn.innerText = isLoginMode ? "Login" : "Konto erstellen";
        }
    });
</script>

</body>
</html>
