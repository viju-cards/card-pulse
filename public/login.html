<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Pro - Login</title>
    <link rel="icon" type="image/png" href="/favicon1.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --poke-blue: #00adbd;
            --bg-beige: #f8f9fa; 
            --card-shadow: 0 20px 40px rgba(0,0,0,0.05);
            --text-dark: #121826;
            --text-muted: #64748b;
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        body { 
            font-family: var(--font-body); 
            background-color: var(--bg-beige); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px;
        }

        .card { 
            background: white; 
            padding: 45px 35px; 
            border-radius: 28px; 
            box-shadow: var(--card-shadow); 
            width: 100%; 
            max-width: 400px; 
            text-align: center;
            border: 1px solid #f0f0f0;
        }

        .logo-container { margin-bottom: 25px; }
        .logo-container img { width: 160px; height: auto; }

        h2 { 
            font-family: var(--font-head);
            color: var(--text-dark); 
            margin: 0 0 25px 0; 
            font-size: 26px; 
            font-weight: 800;
            letter-spacing: -1px;
        }

        input { 
            width: 100%; 
            padding: 16px; 
            margin: 10px 0; 
            border: 1px solid #e2e8f0; 
            border-radius: 14px; 
            box-sizing: border-box; 
            font-size: 15px; 
            font-family: var(--font-body);
            background: #f8fafc;
            transition: all 0.2s ease; 
        }

        input:focus { 
            border-color: var(--poke-blue); 
            background: white;
            outline: none; 
            box-shadow: 0 0 0 4px rgba(0, 173, 189, 0.1);
        }

        button { 
            width: 100%; 
            padding: 16px; 
            background: #000000; 
            color: white; 
            border: none; 
            border-radius: 14px; 
            cursor: pointer; 
            font-family: var(--font-body);
            font-weight: 700; 
            font-size: 16px; 
            margin-top: 15px; 
            transition: all 0.2s; 
        }

        button:hover { opacity: 0.85; transform: translateY(-1px); }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }

        .toggle-link { 
            margin-top: 25px; 
            font-size: 14px; 
            color: var(--text-muted); 
            cursor: pointer; 
        }

        .toggle-link b { color: var(--poke-blue); font-weight: 700; }
        
        .forgot-password {
            margin-top: 15px;
            font-size: 13px;
        }
        
        .forgot-password a {
            color: var(--text-muted);
            text-decoration: none;
        }
        .forgot-password a:hover { text-decoration: underline; }

        #message { 
            margin-top: 20px; 
            padding: 14px; 
            border-radius: 12px; 
            font-size: 13px; 
            display: none; 
            font-weight: 600;
        }

        .error { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; display: block !important; }
        .success { background: #eefaf2; color: #16a34a; border: 1px solid #86efac; display: block !important; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <img src="logo.png" alt="PokéScout">
    </div>

    <h2 id="form-title">Anmelden</h2>

    <form id="auth-form">
        <input type="email" id="email" placeholder="E-Mail Adresse" required>
        <input type="password" id="password" placeholder="Passwort" required>
        <button type="submit" id="submit-btn">Login</button>
    </form>
    
    <div id="message"></div>
    
    <div class="forgot-password">
        <a href="mailto:support@poke-scout.com">Passwort vergessen?</a>
    </div>

    <div class="toggle-link" id="toggle-auth">
        Noch kein Account? <b>Jetzt registrieren</b>
    </div>
</div>

<script>
    const form = document.getElementById('auth-form');
    const title = document.getElementById('form-title');
    const btn = document.getElementById('submit-btn');
    const toggle = document.getElementById('toggle-auth');
    const message = document.getElementById('message');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    
    const API_BASE_URL = "https://poke-scout.com";

    let isLoginMode = true;

    toggle.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        title.innerText = isLoginMode ? "Anmelden" : "Registrieren";
        btn.innerText = isLoginMode ? "Login" : "Konto erstellen";
        toggle.innerHTML = isLoginMode 
            ? "Noch kein Account? <b>Jetzt registrieren</b>" 
            : "Bereits ein Konto? <b>Zum Login</b>";
        
        message.style.display = 'none';
        passwordInput.value = '';
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = emailInput.value;
        const password = passwordInput.value;
        const endpoint = isLoginMode ? '/login' : '/register';

        try {
            btn.disabled = true;
            btn.innerText = "Wird verarbeitet...";
            message.style.display = 'none';

            const response = await fetch(`${API_BASE_URL}${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                if (isLoginMode) {
                    localStorage.setItem('pokescout_token', data.token);

                    if (typeof chrome !== 'undefined' && chrome.storage && chrome.storage.local) {
                        chrome.storage.local.set({ 'pokescout_token': data.token }, () => {
                            showSuccess("Login erfolgreich!");
                            setTimeout(() => { window.location.href = "index.html"; }, 800);
                        });
                    } else {
                        showSuccess("Login erfolgreich!");
                        setTimeout(() => { window.location.href = "index.html"; }, 800);
                    }
                } else {
                    showSuccess("Konto erstellt! Du kannst dich jetzt einloggen.");
                    btn.disabled = false;
                    btn.innerText = "Konto erstellen";
                    passwordInput.value = '';
                    setTimeout(() => { if (!isLoginMode) toggle.click(); }, 2000);
                }
            } else {
                showError(data.error || "Fehler beim Authentifizieren.");
            }
        } catch (err) {
            showError("Server momentan nicht erreichbar.");
        } finally {
            if (!isLoginMode) {
                btn.disabled = false;
                btn.innerText = "Konto erstellen";
            }
        }
    });

    function showError(txt) {
        message.className = "error";
        message.innerText = txt;
        btn.disabled = false;
        btn.innerText = isLoginMode ? "Login" : "Konto erstellen";
    }

    function showSuccess(txt) {
        message.className = "success";
        message.innerText = txt;
    }
</script>
</body>
</html>
