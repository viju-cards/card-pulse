<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Pro - Login</title>
    <style>
        :root {
            --poke-blue: #20558a;
            --bg-beige: #f1efe7; 
            --card-shadow: 0 10px 25px rgba(0,0,0,0.05);
            --text-dark: #1a1a1a;
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-beige); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px;
        }

        .card { 
            background: white; 
            padding: 40px 30px; 
            border-radius: 24px; 
            box-shadow: var(--card-shadow); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
        }

        .logo-container { margin-bottom: 25px; }
        .logo-container img { width: 160px; height: auto; }

        h2 { 
            color: var(--text-dark); 
            margin: 0 0 20px 0; 
            font-size: 22px; 
            font-weight: 800;
        }

        input { 
            width: 100%; 
            padding: 14px; 
            margin: 8px 0; 
            border: 1px solid #e2e8f0; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-size: 15px; 
            background: #f8fafc;
            transition: all 0.2s; 
        }

        input:focus { 
            border-color: var(--poke-blue); 
            background: white;
            outline: none; 
            box-shadow: 0 0 0 3px rgba(32, 85, 138, 0.1);
        }

        button { 
            width: 100%; 
            padding: 14px; 
            background: var(--poke-blue); 
            color: white; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 16px; 
            margin-top: 15px; 
            transition: 0.2s; 
        }

        button:hover { opacity: 0.9; transform: translateY(-1px); }
        button:disabled { background: #cbd5e1; cursor: not-allowed; transform: none; }

        .toggle-link { 
            margin-top: 25px; 
            font-size: 13px; 
            color: var(--text-muted); 
            cursor: pointer; 
        }

        .toggle-link b { color: var(--poke-blue); text-decoration: none; }
        .toggle-link b:hover { text-decoration: underline; }

        #message { 
            margin-top: 20px; 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 13px; 
            display: none; 
            font-weight: 500;
            line-height: 1.4; 
        }

        .error { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; display: block !important; }
        .success { background: #eefaf2; color: #16a34a; border: 1px solid #86efac; display: block !important; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <img src="logo.png" alt="PokéScout">
    </div>

    <h2 id="form-title">Anmelden</h2>

    <form id="auth-form">
        <input type="email" id="email" placeholder="E-Mail Adresse" required>
        <input type="password" id="password" placeholder="Passwort" required>
        <button type="submit" id="submit-btn">Login</button>
    </form>
    
    <div id="message"></div>
    
    <div class="toggle-link" id="toggle-auth">
        Noch kein Account? <b>Jetzt registrieren</b>
    </div>
</div>

<script>
    const form = document.getElementById('auth-form');
    const title = document.getElementById('form-title');
    const btn = document.getElementById('submit-btn');
    const toggle = document.getElementById('toggle-auth');
    const message = document.getElementById('message');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    
    let isLoginMode = true;

    toggle.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        title.innerText = isLoginMode ? "Anmelden" : "Registrieren";
        btn.innerText = isLoginMode ? "Login" : "Konto erstellen";
        toggle.innerHTML = isLoginMode 
            ? "Noch kein Account? <b>Jetzt registrieren</b>" 
            : "Bereits ein Konto? <b>Zum Login</b>";
        
        btn.disabled = false;
        message.style.display = 'none';
        passwordInput.value = '';
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = emailInput.value;
        const password = passwordInput.value;
        const endpoint = isLoginMode ? '/login' : '/register';

        try {
            btn.disabled = true;
            btn.innerText = "Verarbeite...";
            message.style.display = 'none';

            const response = await fetch(`https://pokecardscout-api.onrender.com${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                if (isLoginMode) {
                    localStorage.setItem('poketool_token', data.token);
                    message.className = "success";
                    message.innerText = "Erfolgreich eingeloggt!";
                    
                    setTimeout(() => {
                        window.location.href = "index.html"; 
                    }, 800);
                } else {
                    message.className = "success";
                    message.innerText = "Konto erstellt! Bitte logge dich jetzt ein.";
                    btn.disabled = false;
                    btn.innerText = "Login";
                    passwordInput.value = '';

                    setTimeout(() => {
                        if (!isLoginMode) toggle.click();
                    }, 2000);
                }
            } else {
                message.className = "error";
                message.innerText = data.error || "Ein Fehler ist aufgetreten.";
                btn.disabled = false;
                btn.innerText = isLoginMode ? "Login" : "Konto erstellen";
            }
        } catch (err) {
            message.className = "error";
            message.innerText = "Server nicht erreichbar.";
            btn.disabled = false;
            btn.innerText = isLoginMode ? "Login" : "Konto erstellen";
        }
    });
</script>

</body>
</html>
