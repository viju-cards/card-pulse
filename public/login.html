<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Pro - Login & Registrierung</title>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background: #f4f7f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        h2 { color: #20558a; margin-bottom: 25px; font-size: 24px; }
        input { width: 100%; padding: 14px; margin: 10px 0; border: 1px solid #e1e8ed; border-radius: 8px; box-sizing: border-box; font-size: 16px; transition: border 0.3s; }
        input:focus { border-color: #20558a; outline: none; }
        button { width: 100%; padding: 14px; background: #20558a; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-top: 20px; transition: background 0.3s; }
        button:hover { background: #1a446e; }
        .toggle-link { margin-top: 20px; font-size: 14px; color: #657786; cursor: pointer; }
        .toggle-link b { color: #20558a; text-decoration: underline; }
        #message { margin-top: 15px; padding: 10px; border-radius: 6px; font-size: 14px; display: none; }
        .error { background: #fee2e2; color: #dc2626; border: 1px solid #fca5a5; }
        .success { background: #dcfce7; color: #16a34a; border: 1px solid #86efac; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="form-title">Anmelden</h2>
    <form id="auth-form">
        <input type="email" id="email" placeholder="E-Mail Adresse" required>
        <input type="password" id="password" placeholder="Passwort" required>
        <button type="submit" id="submit-btn">Login</button>
    </form>
    
    <div id="message"></div>
    
    <div class="toggle-link" id="toggle-auth">
        Noch kein Account? <b>Jetzt registrieren</b>
    </div>
</div>

<script>
    const form = document.getElementById('auth-form');
    const title = document.getElementById('form-title');
    const btn = document.getElementById('submit-btn');
    const toggle = document.getElementById('toggle-auth');
    const message = document.getElementById('message');
    
    let isLoginMode = true;

    // Umschalten zwischen Login und Registrierung
    toggle.addEventListener('click', () => {
        isLoginMode = !isLoginMode;
        title.innerText = isLoginMode ? "Anmelden" : "Registrieren";
        btn.innerText = isLoginMode ? "Login" : "Konto erstellen";
        toggle.innerHTML = isLoginMode 
            ? "Noch kein Account? <b>Jetzt registrieren</b>" 
            : "Bereits ein Konto? <b>Zum Login</b>";
        message.style.display = 'none';
        form.reset();
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        // Dynamischer Endpunkt je nach Modus
        const endpoint = isLoginMode ? '/login' : '/register';
        const url = `https://pokecardscout-api.onrender.com${endpoint}`;

        try {
            message.style.display = 'none';
            btn.disabled = true;
            btn.innerText = "Bitte warten...";

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                if (isLoginMode) {
                    // Erfolg beim Login
                    localStorage.setItem('poketool_token', data.token);
                    message.className = "success";
                    message.innerText = "Login erfolgreich! Leite weiter...";
                    message.style.display = "block";
                    
                    // Kurze Verzögerung für das User-Feedback
                    setTimeout(() => {
                        window.location.href = "index.html"; 
                    }, 1000);
                } else {
                    // Erfolg bei Registrierung
                    message.className = "success";
                    message.innerText = "Konto erstellt! Du kannst dich jetzt einloggen.";
                    message.style.display = "block";
                    
                    // Automatisch zum Login-Modus wechseln
                    setTimeout(() => { toggle.click(); }, 2000);
                }
            } else {
                // Fehler vom Server (z.B. User existiert bereits)
                message.className = "error";
                message.innerText = data.error || "Ein Fehler ist aufgetreten.";
                message.style.display = "block";
                btn.disabled = false;
                btn.innerText = isLoginMode ? "Login" : "Konto erstellen";
            }
        } catch (err) {
            message.className = "error";
            message.innerText = "Verbindung zum Server fehlgeschlagen.";
            message.style.display = "block";
            btn.disabled = false;
            btn.innerText = isLoginMode ? "Login" : "Konto erstellen";
        }
    });
</script>

</body>
</html>
