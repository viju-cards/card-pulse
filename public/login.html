<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Pro - Login</title>
    <style>
        body { font-family: 'Inter', sans-serif; background: #f1f2f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
        h2 { color: #20558a; margin-top: 0; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #dcdde1; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #20558a; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #1a446e; }
        .toggle-link { text-align: center; margin-top: 15px; font-size: 14px; color: #7f8c8d; cursor: pointer; }
        .toggle-link b { color: #20558a; }
        #message { text-align: center; font-size: 13px; margin-top: 10px; display: none; }
    </style>
</head>
<body>

<div class="card">
    <h2 id="form-title">Anmelden</h2>
    <form id="auth-form">
        <input type="email" id="email" placeholder="E-Mail Adresse" required>
        <input type="password" id="password" placeholder="Passwort" required>
        <button type="submit" id="submit-btn">Login</button>
    </form>
    <div id="message"></div>
    <div class="toggle-link" id="toggle-auth">
        Noch kein Account? <b>Jetzt registrieren</b>
    </div>
</div>

<script>
    const form = document.getElementById('auth-form');
    const title = document.getElementById('form-title');
    const btn = document.getElementById('submit-btn');
    const toggle = document.getElementById('toggle-auth');
    const message = document.getElementById('message');
    
    let isLogin = true;

    toggle.addEventListener('click', () => {
        isLogin = !isLogin;
        title.innerText = isLogin ? "Anmelden" : "Registrieren";
        btn.innerText = isLogin ? "Login" : "Konto erstellen";
        toggle.innerHTML = isLogin ? "Noch kein Account? <b>Jetzt registrieren</b>" : "Schon dabei? <b>Zum Login</b>";
        message.style.display = 'none';
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const endpoint = isLogin ? '/login' : '/register';

        try {
            const response = await fetch(`https://deine-api.render.com${endpoint}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });
            const data = await response.json();

            if (response.ok) {
                if (isLogin) {
                    localStorage.setItem('poketool_token', data.token);
                    window.location.href = "index.html"; // Oder direkt zurück zur Karte
                } else {
                    message.style.color = "green";
                    message.innerText = "Erfolgreich registriert! Bitte logge dich ein.";
                    message.style.display = "block";
                    toggle.click(); // Zum Login wechseln
                }
            } else {
                message.style.color = "red";
                message.innerText = data.error || "Fehler aufgetreten";
                message.style.display = "block";
            }
        } catch (err) {
            console.error("Auth-Fehler:", err);
        }
    });
</script>

</body>
</html>
