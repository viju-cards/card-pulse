<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supported Sets – CardPulse</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@700;800;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--surface:#0f0f1c;--card:#13131f;--border:rgba(255,255,255,0.06);--accent:#6c63ff;--yellow:#ffd700;--teal:#00d4aa;--text:#e8e8f0;--muted:#5a5a78}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(108,99,255,0.1) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%)}
nav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 48px;background:rgba(9,9,15,0.9);border-bottom:1px solid var(--border);backdrop-filter:blur(20px)}
.logo{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--text);text-decoration:none;letter-spacing:1px;line-height:1.6}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:8px;align-items:center}
.main{flex:1;position:relative;z-index:1;max-width:800px;margin:0 auto;width:100%;padding:64px 48px}
h1{font-family:"Barlow Condensed",sans-serif;font-size:clamp(40px,5vw,72px);font-weight:900;text-transform:uppercase;letter-spacing:-1px;line-height:.95;margin-bottom:20px}
h2{font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:800;text-transform:uppercase;letter-spacing:-.5px;margin:36px 0 12px;color:var(--text)}
h3{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;text-transform:uppercase;margin:24px 0 8px;color:var(--accent)}
p{font-family:"DM Mono",monospace;font-size:13px;color:var(--muted);line-height:1.9;margin-bottom:14px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
strong{color:var(--text);font-weight:500}
.updated{font-family:"Press Start 2P",monospace;font-size:7px;color:var(--muted);letter-spacing:1px;margin-bottom:32px;display:block}
.section-label{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--accent);letter-spacing:2px;margin-bottom:20px;display:block}
.section-label::before{content:"> "}
.page-sub{font-size:15px;margin-bottom:40px;color:var(--muted)}
.block{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 24px;margin-bottom:16px}
.block p{margin:0;line-height:1.7}
.block strong{font-family:"Press Start 2P",monospace;font-size:8px;letter-spacing:.5px;display:block;margin-bottom:8px;color:var(--accent)}
hr{border:none;border-top:1px solid var(--border);margin:32px 0}
#sets-grid{display:none}
@media(max-width:768px){nav{padding:10px 16px}.main{padding:48px 20px}h1{font-size:40px}}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">card<span>pulse</span></a>
  <div class="nav-links"></div>
</nav>
<div class="main">
<span class="section-label" data-i18n="sets_page_label">Compatibility</span>
  <h1 data-i18n="sets_page_h1">Supported<br>Sets.</h1>
  <p class="page-sub" data-i18n="sets_page_sub">All Pokémon TCG sets currently supported by CardPulse.</p>

  <div id="sets-loading" style="font-family:'Press Start 2P',monospace;font-size:8px;color:var(--muted);letter-spacing:1px;padding:40px 0">
    > LOADING SETS...
  </div>
  <div id="sets-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;display:none"></div>
  <div id="sets-error" style="display:none;font-family:'DM Mono',monospace;font-size:13px;color:var(--muted)">
    Could not load sets. Please try again later.
  </div>
</div>
<script src="/i18n.js"></script>
<script src="/shared.js"></script>
<script>
fetch('/sets')
  .then(r => r.json())
  .then(data => {
    document.getElementById('sets-loading').style.display = 'none';
    const grid = document.getElementById('sets-grid');
    grid.style.display = 'grid';
    const sets = data.sets || [];
    if (!sets.length) { grid.innerHTML = '<p style="font-family:var(--mono);color:var(--muted)">No sets found.</p>'; return; }
    grid.innerHTML = sets.map(s => {
      const name = s.replace(/-/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      const code = s.split('-').map(w=>w[0]?.toUpperCase()||'').join('').slice(0,4);
      return `<div style="background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;display:flex;align-items:center;gap:12px">
        <div style="font-family:'Press Start 2P',monospace;font-size:8px;color:var(--accent);background:rgba(108,99,255,0.1);border:1px solid rgba(108,99,255,0.2);border-radius:5px;padding:6px 8px;min-width:40px;text-align:center;flex-shrink:0">${code}</div>
        <div style="font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);line-height:1.4">${name}</div>
      </div>`;
    }).join('');
  })
  .catch(() => {
    document.getElementById('sets-loading').style.display = 'none';
    document.getElementById('sets-error').style.display = 'block';
  });
</script>
</body>
</html>
