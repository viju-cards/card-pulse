<html lang="en" translate="no">
<head>
<meta charset="UTF-8"><meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Supported Sets – CardPulse</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@700;800;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--card:#13131f;--border:rgba(255,255,255,0.06);--accent:#6c63ff;--text:#e8e8f0;--muted:#5a5a78}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(108,99,255,0.1) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%)}
nav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 48px;background:rgba(9,9,15,0.9);border-bottom:1px solid var(--border);backdrop-filter:blur(20px)}
.logo{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--text);text-decoration:none;letter-spacing:1px;line-height:1.6}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:8px;align-items:center}
.main{flex:1;position:relative;z-index:1;max-width:1100px;margin:0 auto;width:100%;padding:60px 48px}
.section-label{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--accent);letter-spacing:2px;margin-bottom:20px;display:block}
.section-label::before{content:"> "}
h1{font-family:"Barlow Condensed",sans-serif;font-size:clamp(40px,5vw,72px);font-weight:900;text-transform:uppercase;letter-spacing:-1px;line-height:.95;margin-bottom:12px}
.subtitle{font-family:"DM Mono",monospace;font-size:13px;color:var(--muted);margin-bottom:28px}

/* Lang toggle */
.lang-toggle{display:flex;gap:0;margin-bottom:28px;border:1px solid var(--border);border-radius:8px;overflow:hidden;width:fit-content}
.lang-btn{padding:9px 24px;background:transparent;border:none;color:var(--muted);font-family:"DM Mono",monospace;font-size:12px;font-weight:700;cursor:pointer;transition:.2s;letter-spacing:1px}
.lang-btn:first-child{border-right:1px solid var(--border)}
.lang-btn.active{background:rgba(108,99,255,0.15);color:var(--text)}
.lang-btn:hover:not(.active){background:rgba(255,255,255,0.04)}

.search-wrap{position:relative;margin-bottom:16px;max-width:480px}
.search-wrap::before{content:">";position:absolute;left:14px;top:50%;transform:translateY(-50%);font-family:"Press Start 2P",monospace;font-size:9px;color:var(--accent);pointer-events:none}
#search{width:100%;padding:13px 14px 13px 34px;background:rgba(0,0,0,0.5);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:"DM Mono",monospace;font-size:13px;outline:none;transition:.2s}
#search:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,0.1)}
#search::placeholder{color:var(--muted)}
.era-filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:24px}
.era-btn{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:transparent;color:var(--muted);font-family:"DM Mono",monospace;font-size:10px;cursor:pointer;transition:.2s;white-space:nowrap}
.all-btn{border-color:var(--accent);color:var(--accent)}
.all-btn.active{background:rgba(108,99,255,0.15)}
.stats-bar{font-family:"DM Mono",monospace;font-size:12px;color:var(--muted);margin-bottom:24px}
.stats-bar strong{color:var(--accent)}
.era-section{margin-bottom:32px}
.era-heading{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.era-title{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:800;text-transform:uppercase}
.era-count{font-family:"Press Start 2P",monospace;font-size:7px;color:var(--muted);letter-spacing:1px}
.sets-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.set-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 12px;display:flex;align-items:center;gap:10px;transition:.15s;text-decoration:none;color:inherit}
.set-card:hover{border-color:rgba(108,99,255,0.3);background:rgba(108,99,255,0.04);transform:translateY(-1px)}
.set-code{font-family:"Press Start 2P",monospace;font-size:6px;letter-spacing:.3px;padding:5px 6px;border-radius:4px;min-width:40px;text-align:center;flex-shrink:0;line-height:1.8;white-space:nowrap}
.set-name{font-family:"DM Mono",monospace;font-size:12px;color:var(--muted);line-height:1.4}
#no-results{display:none;font-family:"Press Start 2P",monospace;font-size:8px;color:var(--muted);letter-spacing:1px;padding:60px 0;text-align:center}
@media(max-width:768px){nav{padding:10px 16px}.main{padding:40px 20px}h1{font-size:40px}.sets-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}.era-filters{gap:5px}}
</style>
</head>

  <p class="subtitle" id="subtitle-text"><strong style="color:var(--accent)" id="total-count">195</strong> sets · <span>click any set to browse on Cardmarket</span></p>

  <!-- Language toggle -->
  <div class="lang-toggle">
    <button class="lang-btn active" id="btn-en" onclick="switchLang('en')">🇺🇸 ENGLISH</button>
    <button class="lang-btn" id="btn-jp" onclick="switchLang('jp')">🇯🇵 JAPANESE</button>
  </div>

  <div class="search-wrap">
    <input type="text" id="search" placeholder="Search sets or codes..." oninput="doSearch(this.value)">
  </div>

  <div class="era-filters" id="era-filters">

  <div class="stats-bar">Showing <strong id="visibleCount">0</strong> sets</div>
  <div id="no-results">> NO SETS FOUND</div>
  <div id="sets-container"></div>
</div>

var TOTAL_EN = 195;
var TOTAL_JP = 128;

var lang = 'en';
var era = 'all';
var q = '';
var CM = 'https://www.cardmarket.com/en/Pokemon/Products/Singles/';

function currentData() { return lang === 'en' ? ENG : JP; }
function currentColors() { return lang === 'en' ? ENG_COLORS : JP_COLORS; }

function buildEraFilters() {
  var container = document.getElementById('era-filters');
  var eras = Object.keys(currentData());
  container.innerHTML = '<button class="era-btn all-btn' + (era==='all'?' active':'') + '" data-era="all" onclick="filterEra(this)">All eras</button>';
  eras.forEach(function(e) {
    var c = currentColors()[e] || '#5a5a78';
    var btn = document.createElement('button');
    btn.className = 'era-btn' + (era===e?' active':'');
    btn.dataset.era = e;
    btn.textContent = e;
    btn.onclick = function() { filterEra(btn); };
    if (era === e) { btn.style.background=c+'1a'; btn.style.borderColor=c; btn.style.color=c; }
    btn.addEventListener('mouseenter', function() { if (!btn.classList.contains('active')) { btn.style.borderColor=c; btn.style.color=c; } });
    btn.addEventListener('mouseleave', function() { if (!btn.classList.contains('active')) { btn.style.borderColor=''; btn.style.color=''; } });
    container.appendChild(btn);
  });
}

function build() {
  var box = document.getElementById('sets-container');
  box.innerHTML = '';
  var n = 0;
  var data = currentData();
  var colors = currentColors();
  Object.keys(data).forEach(function(e) {
    var c = colors[e] || '#5a5a78';
    var list = data[e].filter(function(s) {
      return (era==='all'||era===e) && (!q||s.name.toLowerCase().includes(q)||s.code.toLowerCase().includes(q));
    });
    if (!list.length) return;
    n += list.length;
    var sec = document.createElement('div');
    sec.className = 'era-section';
    sec.innerHTML = '<div class="era-heading"><div class="era-title" style="color:'+c+'">'+e+'</div><div class="era-count">'+list.length+' SETS</div></div>'
      +'<div class="sets-grid">'+list.map(function(s) {
        var url = CM + s.slug;
        return '<a class="set-card" href="'+url+'" target="_blank" rel="noopener">'
          +'<div class="set-code" style="background:rgba(0,0,0,0.4);border:1px solid '+c+'44;color:'+c+'">'+s.code+'</div>'
          +'<div class="set-name">'+s.name+'</div></a>';
      }).join('')+'</div>';
    box.appendChild(sec);
  });
  document.getElementById('visibleCount').textContent = n;
  document.getElementById('no-results').style.display = n ? 'none' : 'block';
}

function filterEra(btn) {
  document.querySelectorAll('.era-btn').forEach(function(b) { b.classList.remove('active'); b.style.cssText=''; });
  btn.classList.add('active');
  era = btn.dataset.era;
  var c = currentColors()[era];
  if (c) { btn.style.background=c+'1a'; btn.style.borderColor=c; btn.style.color=c; }
  build();
}

function doSearch(v) {
  q = v.toLowerCase().trim();
  if (q) {
    document.querySelectorAll('.era-btn').forEach(function(b) { b.classList.remove('active'); b.style.cssText=''; });
    document.querySelector('.all-btn').classList.add('active');
    era = 'all';
  }
  build();
}

function switchLang(l) {
  lang = l;
  era = 'all';
  q = '';
  document.getElementById('search').value = '';
  document.getElementById('btn-en').classList.toggle('active', l==='en');
  document.getElementById('btn-jp').classList.toggle('active', l==='jp');
  document.getElementById('total-count').textContent = l==='en' ? TOTAL_EN : TOTAL_JP;
  buildEraFilters();
  build();
}

buildEraFilters();
