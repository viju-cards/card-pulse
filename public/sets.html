<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unterstützte Sets – CardPulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#07070d; --surface:#0f0f1a; --border:rgba(108,99,255,0.15);
    --accent:#6c63ff; --accent-dim:rgba(108,99,255,0.12);
    --text:#e8e8f0; --muted:#6b6b80; --green:#22c55e;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--text); font-family:'DM Sans',sans-serif; min-height:100vh; }
  nav { display:flex; justify-content:space-between; align-items:center; padding:20px 48px; border-bottom:1px solid var(--border); position:sticky; top:0; background:rgba(7,7,13,0.9); backdrop-filter:blur(16px); z-index:100; }
  .logo { font-family:'Syne',sans-serif; font-size:20px; font-weight:800; text-decoration:none; color:#fff; }
  .logo span { color:var(--accent); }
  .nav-links { display:flex; gap:8px; }
  .btn-ghost { padding:9px 18px; border-radius:9px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer; text-decoration:none; transition:.2s; }
  .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
  .btn-primary { padding:9px 18px; border-radius:9px; background:var(--accent); border:none; color:#fff; font-family:'DM Sans',sans-serif; font-size:13px; font-weight:500; cursor:pointer; text-decoration:none; }
  .main { max-width:1100px; margin:0 auto; padding:64px 24px; }
  .page-header { margin-bottom:48px; }
  .section-label { font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:2px; margin-bottom:16px; }
  h1 { font-family:'Syne',sans-serif; font-size:clamp(32px,5vw,56px); font-weight:800; letter-spacing:-1.5px; margin-bottom:12px; }
  .page-sub { color:var(--muted); font-size:16px; }

  /* SEARCH */
  .search-row { display:flex; gap:12px; margin-bottom:40px; flex-wrap:wrap; }
  .search-input { flex:1; min-width:200px; padding:12px 18px; background:var(--surface); border:1px solid var(--border); border-radius:12px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:14px; outline:none; transition:.2s; }
  .search-input:focus { border-color:var(--accent); }
  .search-input::placeholder { color:var(--muted); }
  .filter-btn { padding:12px 20px; border-radius:12px; border:1px solid var(--border); background:transparent; color:var(--muted); font-family:'DM Sans',sans-serif; font-size:13px; cursor:pointer; transition:.2s; }
  .filter-btn.active { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }

  /* SETS GRID */
  .era-section { margin-bottom:48px; }
  .era-title { font-family:'Syne',sans-serif; font-size:14px; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:16px; padding-bottom:12px; border-bottom:1px solid var(--border); }
  .sets-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:12px; }
  .set-card { background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:20px; cursor:pointer; transition:.2s; text-decoration:none; display:block; }
  .set-card:hover { border-color:var(--accent); background:#131325; transform:translateY(-2px); }
  .set-code { font-family:'DM Mono',monospace; font-size:11px; color:var(--accent); margin-bottom:8px; }
  .set-name { font-size:14px; font-weight:500; color:var(--text); margin-bottom:6px; line-height:1.3; }
  .set-link { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:4px; }
  .set-link::after { content:'→'; }
  .set-card:hover .set-link { color:var(--accent); }

  .count { font-size:14px; color:var(--muted); margin-bottom:24px; }
  .count span { color:var(--accent); font-weight:700; }

  #noResults { display:none; text-align:center; padding:60px; color:var(--muted); }
</style>
</head>
<body>

<nav>
  <a href="/" class="logo">card<span>pulse</span></a>
  <div class="nav-links">
    <a href="/login.html" class="btn-ghost">Anmelden</a>
    <a href="/register.html" class="btn-primary">Kostenlos starten</a>
  </div>
</nav>

<div class="main">
  <div class="page-header">
    <div class="section-label">Kompatibilität</div>
    <h1>Unterstützte Sets</h1>
    <p class="page-sub">Alle Kartensätze für die TCGPlayer-Preise angezeigt werden.</p>
  </div>

  <div class="search-row">
    <input type="text" class="search-input" id="search" placeholder="Set suchen... z.B. Surging Sparks, sv08">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all',this)">Alle</button>
    <button class="filter-btn" data-filter="sv" onclick="setFilter('sv',this)">Scarlet & Violet</button>
    <button class="filter-btn" data-filter="swsh" onclick="setFilter('swsh',this)">Sword & Shield</button>
    <button class="filter-btn" data-filter="sm" onclick="setFilter('sm',this)">Sun & Moon</button>
    <button class="filter-btn" data-filter="xy" onclick="setFilter('xy',this)">XY</button>
  </div>

  <p class="count" id="countText">Lade Sets...</p>
  <div id="setsContainer"></div>
  <div id="noResults">Keine Sets für diese Suche gefunden.</div>
</div>

<script>
// Alle bekannten Sets mit Namen und Cardmarket-URL
const SETS = [
  // Scarlet & Violet
  { code:'DRI', name:'Destined Rivals', era:'sv', slug:'sv10-destined-rivals', cm:'Destined-Rivals' },
  { code:'JTG', name:'Journey Together', era:'sv', slug:'sv09-journey-together', cm:'Journey-Together' },
  { code:'PRE', name:'Prismatic Evolutions', era:'sv', slug:'sv-prismatic-evolutions', cm:'Prismatic-Evolutions' },
  { code:'SSP', name:'Surging Sparks', era:'sv', slug:'sv08-surging-sparks', cm:'Surging-Sparks' },
  { code:'SCR', name:'Stellar Crown', era:'sv', slug:'sv07-stellar-crown', cm:'Stellar-Crown' },
  { code:'WHT', name:'White Flare', era:'sv', slug:'sv-white-flare', cm:'White-Flare' },
  { code:'sv8a', name:'Terastal Fest ex', era:'sv', slug:'sv8a-terastal-fest-ex', cm:'Terastal-Fest-ex' },
  { code:'sv7', name:'Stellar Miracle', era:'sv', slug:'sv7-stellar-miracle', cm:'Stellar-Miracle' },
  { code:'sv7a', name:'Paradise Dragona', era:'sv', slug:'sv7a-paradise-dragona', cm:'Paradise-Dragona' },
  { code:'sv6a', name:'Night Wanderer', era:'sv', slug:'sv6a-night-wanderer', cm:'Night-Wanderer' },
  { code:'sv5M', name:'Cyber Judge', era:'sv', slug:'sv5m-cyber-judge', cm:'Cyber-Judge' },
  { code:'sv5K', name:'Wild Force', era:'sv', slug:'sv5k-wild-force', cm:'Wild-Force' },
  { code:'sv5a', name:'Crimson Haze', era:'sv', slug:'sv5a-crimson-haze', cm:'Crimson-Haze' },
  { code:'sv4a', name:'Shiny Treasure ex', era:'sv', slug:'sv4a-shiny-treasure-ex', cm:'Shiny-Treasure-ex' },
  { code:'sv4K', name:'Ancient Roar', era:'sv', slug:'sv4k-ancient-roar', cm:'Ancient-Roar' },
  { code:'sv4M', name:'Future Flash', era:'sv', slug:'sv4m-future-flash', cm:'Future-Flash' },
  { code:'sv3a', name:'Raging Surf', era:'sv', slug:'sv3a-raging-surf', cm:'Raging-Surf' },
  { code:'sv2a', name:'Pokémon Card 151', era:'sv', slug:'sv2a-pokemon-card-151', cm:'Pokemon-Card-151' },
  { code:'sv2D', name:'Clay Burst', era:'sv', slug:'sv2d-clay-burst', cm:'Clay-Burst' },
  { code:'sv2P', name:'Snow Hazard', era:'sv', slug:'sv2p-snow-hazard', cm:'Snow-Hazard' },
  { code:'sv1S', name:'Scarlet ex', era:'sv', slug:'sv1s-scarlet-ex', cm:'Scarlet-ex' },
  { code:'sv1V', name:'Violet ex', era:'sv', slug:'sv1v-violet-ex', cm:'Violet-ex' },
  { code:'sv1a', name:'Triplet Beat', era:'sv', slug:'sv1a-triplet-beat', cm:'Triplet-Beat' },
  { code:'SV-P', name:'SV Promo', era:'sv', slug:'sv-p-promotional-cards', cm:'SV-P-Promotional-Cards' },
  // Sword & Shield
  { code:'SSH', name:'Sword & Shield Base', era:'swsh', slug:'swsh01-sword-and-shield-base-set', cm:'Sword-and-Shield' },
  { code:'s12a', name:'VSTAR Universe', era:'swsh', slug:'s12a-vstar-universe', cm:'VSTAR-Universe' },
  { code:'s12', name:'Paradigm Trigger', era:'swsh', slug:'s12-paradigm-trigger', cm:'Paradigm-Trigger' },
  { code:'s11a', name:'Incandescent Arcana', era:'swsh', slug:'s11a-incandescent-arcana', cm:'Incandescent-Arcana' },
  { code:'s11', name:'Lost Abyss', era:'swsh', slug:'s11-lost-abyss', cm:'Lost-Abyss' },
  { code:'s10P', name:'Space Juggler', era:'swsh', slug:'s10p-space-juggler', cm:'Space-Juggler' },
  { code:'s10D', name:'Time Gazer', era:'swsh', slug:'s10d-time-gazer', cm:'Time-Gazer' },
  { code:'s10a', name:'Dark Phantasma', era:'swsh', slug:'s10a-dark-phantasma', cm:'Dark-Phantasma' },
  { code:'s9a', name:'Battle Region', era:'swsh', slug:'s9a-battle-region', cm:'Battle-Region' },
  { code:'s9', name:'Star Birth', era:'swsh', slug:'s9-star-birth', cm:'Star-Birth' },
  { code:'s8b', name:'VMAX Climax', era:'swsh', slug:'s8b-vmax-climax', cm:'VMAX-Climax' },
  { code:'s8a', name:'25th Anniversary Collection', era:'swsh', slug:'s8a-25th-anniversary-collection', cm:'25th-Anniversary-Collection' },
  { code:'s7R', name:'Blue Sky Stream', era:'swsh', slug:'s7r-blue-sky-stream', cm:'Blue-Sky-Stream' },
  { code:'s6a', name:'Eevee Heroes', era:'swsh', slug:'s6a-eevee-heroes', cm:'Eevee-Heroes' },
  { code:'s4a', name:'Shiny Star V', era:'swsh', slug:'s4a-shiny-star-v', cm:'Shiny-Star-V' },
  { code:'sI100', name:'Start Deck 100', era:'swsh', slug:'si-start-deck-100', cm:'Start-Deck-100' },
  // Sun & Moon
  { code:'sm12a', name:'Tag Team GX All Stars', era:'sm', slug:'sm12a-tag-team-gx-tag-all-stars', cm:'TAG-TEAM-GX-Tag-All-Stars' },
  { code:'sm12', name:'Alter Genesis', era:'sm', slug:'sm12-alter-genesis', cm:'Alter-Genesis' },
  { code:'sm11b', name:'Dream League', era:'sm', slug:'sm11b-dream-league', cm:'Dream-League' },
  { code:'sm11', name:'Miracle Twin', era:'sm', slug:'sm11-miracle-twin', cm:'Miracle-Twin' },
  { code:'sm10b', name:'Sky Legend', era:'sm', slug:'sm10b-sky-legend', cm:'Sky-Legend' },
  { code:'sm10', name:'Double Blaze', era:'sm', slug:'sm10-double-blaze', cm:'Double-Blaze' },
  { code:'sm9b', name:'Full Metal Wall', era:'sm', slug:'sm9b-full-metal-wall', cm:'Full-Metal-Wall' },
  { code:'sm9a', name:'Night Unison', era:'sm', slug:'sm9a-night-unison', cm:'Night-Unison' },
  { code:'sm9', name:'Tag Bolt', era:'sm', slug:'sm9-tag-bolt', cm:'Tag-Bolt' },
  { code:'sm8b', name:'GX Ultra Shiny', era:'sm', slug:'sm8b-gx-ultra-shiny', cm:'GX-Ultra-Shiny' },
  { code:'sm5s', name:'Ultra Sun', era:'sm', slug:'sm5s-ultra-sun', cm:'Ultra-Sun' },
  { code:'sm5m', name:'Ultra Moon', era:'sm', slug:'sm5m-ultra-moon', cm:'Ultra-Moon' },
  // XY
  { code:'XY9', name:'Rage of the Broken Heavens', era:'xy', slug:'xy9-rage-of-the-broken-heavens', cm:'Rage-of-the-Broken-Heavens' },
  { code:'XY8r', name:'Red Flash', era:'xy', slug:'xy8-br-red-flash', cm:'Red-Flash' },
  { code:'XY8b', name:'Blue Shock', era:'xy', slug:'xy8-bb-blue-shock', cm:'Blue-Shock' },
  { code:'XY7', name:'Bandit Ring', era:'xy', slug:'xy7-bandit-ring', cm:'Bandit-Ring' },
  { code:'XY6', name:'Emerald Break', era:'xy', slug:'xy6-emerald-break', cm:'Emerald-Break' },
  { code:'XY4', name:'Phantom Gate', era:'xy', slug:'xy4-phantom-gate', cm:'Phantom-Gate' },
  { code:'XY3', name:'Rising Fist', era:'xy', slug:'xy3-rising-fist', cm:'Rising-Fist' },
  { code:'XY2', name:'Wild Blaze', era:'xy', slug:'xy2-wild-blaze', cm:'Wild-Blaze' },
];

const ERA_LABELS = { sv:'Scarlet & Violet', swsh:'Sword & Shield', sm:'Sun & Moon', xy:'XY' };
const CM_BASE = 'https://www.cardmarket.com/en/Pokemon/Products/Singles/';

let currentFilter = 'all';
let currentSearch = '';

function render() {
  const container = document.getElementById('setsContainer');
  const noResults = document.getElementById('noResults');
  const searchLower = currentSearch.toLowerCase();

  const filtered = SETS.filter(s => {
    const matchesFilter = currentFilter === 'all' || s.era === currentFilter;
    const matchesSearch = !searchLower ||
      s.name.toLowerCase().includes(searchLower) ||
      s.code.toLowerCase().includes(searchLower) ||
      s.slug.toLowerCase().includes(searchLower);
    return matchesFilter && matchesSearch;
  });

  document.getElementById('countText').innerHTML =
    `<span>${filtered.length}</span> Sets gefunden`;

  if (filtered.length === 0) {
    container.innerHTML = '';
    noResults.style.display = 'block';
    return;
  }
  noResults.style.display = 'none';

  // Nach Era gruppieren
  const grouped = {};
  filtered.forEach(s => {
    if (!grouped[s.era]) grouped[s.era] = [];
    grouped[s.era].push(s);
  });

  container.innerHTML = Object.entries(grouped).map(([era, sets]) => `
    <div class="era-section">
      <div class="era-title">${ERA_LABELS[era] || era}</div>
      <div class="sets-grid">
        ${sets.map(s => `
          <a class="set-card" href="${CM_BASE}${s.cm}" target="_blank">
            <div class="set-code">${s.code}</div>
            <div class="set-name">${s.name}</div>
            <div class="set-link">Auf Cardmarket ansehen</div>
          </a>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

document.getElementById('search').addEventListener('input', e => {
  currentSearch = e.target.value;
  render();
});

render();
</script>
</body>
</html>
