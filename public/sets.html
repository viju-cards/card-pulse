<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unterstützte Sets - PokéScout</title>
    <style>
        :root {
            --poke-blue: #20558a;
            --bg-beige: #f1efe7; 
            --card-shadow: 0 10px 25px rgba(0,0,0,0.05);
            --text-dark: #1a1a1a;
            --text-muted: #64748b;
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-beige); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px;
        }

        .card { 
            background: white; 
            padding: 35px 25px; 
            border-radius: 24px; 
            box-shadow: var(--card-shadow); 
            width: 100%; 
            max-width: 380px; 
            text-align: center; 
        }

        .logo-container { margin-bottom: 20px; }
        .logo-container img { width: 140px; height: auto; }

        h2 { 
            color: var(--text-dark); 
            margin: 0 0 15px 0; 
            font-size: 20px; 
            font-weight: 800;
        }

        .set-list {
            text-align: left;
            background: #fafafa;
            border: 1px solid #f0f0f0;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 25px;
        }

        .set-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
            color: var(--text-dark);
            font-weight: 500;
        }

        .set-item:last-child { border-bottom: none; }

        .btn-back { 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 15px; 
            background: var(--poke-blue); 
            color: white;
            border: none;
            text-decoration: none;
            display: block;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <img src="logo.png" alt="PokéScout">
    </div>

    <h2>Unterstützte Sets</h2>
    
    <div class="set-list">
        <div class="set-item">✨ Mega Entwicklungen: Fatale Flammen</div>
        <div class="set-item">✨ Mega Entwicklungen (Basis)</div>
        <div class="set-item">✨ Karmesin & Purpur: Die Reisegefährten</div>
        <div class="set-item">✨ Weitere Sets folgen laufend...</div>
    </div>

    <a href="index.html" class="btn-back">Zurück zum Dashboard</a>
</div>

</body>
</html>
