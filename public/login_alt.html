<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In – CardPulse</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/cardpulse-ui.css">
</head>
<body>
<nav>
  <div class="cp-nav-in">
    <a href="/" class="logo">card<span>pulse</span></a>
    <div class="nav-links"></div>
  </div>
</nav>

<main class="cp-main center">
  <div class="cp-form">
    <span class="sec-eye" data-i18n="login_eyebrow">Sign in</span>
    <h1 class="form-h1" data-i18n="login_h1">Welcome back.</h1>
    <p class="form-sub">
      <span data-i18n="login_no_account">No account yet?</span>
      <a href="/register.html" data-i18n="login_register_link"> Register now</a>
    </p>

    <div class="field">
      <label data-i18n="login_email">Email</label>
      <input type="email" id="email" autocomplete="email">
    </div>
    <div class="field">
      <label data-i18n="login_pw">Password</label>
      <input type="password" id="password" autocomplete="current-password">
      <a href="/forgot-password.html" class="link" data-i18n="forgot_back_link">Forgot password?</a>
    </div>
    <button class="btn btn-solid btn-block" id="loginBtn" data-i18n="login_btn">Sign in</button>
    <div class="msg" id="msg"></div>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/shared.js"></script>
<script>
const API='';
const EXT_ID='gidmncphcliponfkhnamnglljbphdeoe';
async function doLogin(){
  const email=document.getElementById('email').value.trim();
  const password=document.getElementById('password').value;
  const btn=document.getElementById('loginBtn');
  const msg=document.getElementById('msg');
  msg.className='msg';
  if(!email||!password){msg.textContent=window.i18n?.t('login_error_fields')||'Please fill all fields.';msg.className='msg error';return}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>...';
  try{
    const res=await fetch(`${API}/auth/login`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const data=await res.json();
    if(!res.ok){msg.textContent=data.error||'Login failed.';msg.className='msg error';return}
    localStorage.setItem('cp_token',data.token);
    try{chrome.runtime.sendMessage(EXT_ID,{type:'LOGIN_SUCCESS',token:data.token})}catch(e){}
    window.location.href='/dashboard.html';
  }catch(e){msg.textContent=window.i18n?.t('login_error_connection')||'Connection error.';msg.className='msg error'}
  finally{btn.disabled=false;btn.textContent=window.i18n?.t('login_btn')||'Sign in'}
}
document.getElementById('loginBtn').onclick=doLogin;
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('email').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
</script>
</body>
</html>
