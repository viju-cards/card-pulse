<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', -apple-system, sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f7f9; color: #333; }
        .card { background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center; width: 420px; position: relative; border: 1px solid #eef2f6; }
        
        /* Header & Logout */
        h2 { color: #20558a; margin-top: 10px; margin-bottom: 5px; }
        .user-mail { font-size: 14px; color: #657786; margin-bottom: 20px; display: block; }
        .btn-logout { background: #fff; color: #d93025; border: 1px solid #ffccc7; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; position: absolute; top: 15px; right: 15px; transition: 0.2s; }
        .btn-logout:hover { background: #fff1f0; }

        /* Status Badges */
        .status-badge { display: inline-block; padding: 8px 16px; border-radius: 20px; font-size: 14px; margin: 15px 0; font-weight: 700; letter-spacing: 0.5px; }
        .premium-active { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
        .premium-none { background: #f0f7ff; color: #0050b3; border: 1px solid #91d5ff; }

        /* Info Boxen */
        .info-container { margin-top: 20px; padding: 20px; border-radius: 12px; text-align: left; }
        .premium-info-box { background: #fffbe6; border: 1px solid #ffe58f; }
        .standard-info-box { background: #f9f9f9; border: 1px solid #e1e8ed; }
        
        .expiry-text { font-size: 15px; color: #856404; margin-bottom: 10px; font-weight: 500; }
        .info-text { font-size: 14px; color: #4b5563; line-height: 1.5; margin-bottom: 15px; }

        /* Buttons */
        .btn-premium { background: #28a745; color: white; border: none; padding: 14px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 16px; transition: 0.3s; box-shadow: 0 4px 10px rgba(40, 167, 69, 0.2); }
        .btn-premium:hover { background: #218838; transform: translateY(-1px); }
        .btn-manage { background: #fff; color: #20558a; border: 1px solid #20558a; padding: 12px; border-radius: 8px; cursor: pointer; width: 100%; font-weight: 600; transition: 0.2s; }
        .btn-manage:hover { background: #f0f7ff; }

        /* Sync Status */
        #sync-msg { margin-top: 20px; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 500; }
        .success-green { background: #f6ffed; color: #28a745; border: 1px solid #b7eb8f; }
        .info-blue { background: #e7f3ff; color: #20558a; border: 1px solid #d0e7ff; }
    </style>
</head>
<body>
    <div class="card">
        <button class="btn-logout" onclick="logout()">Abmelden</button>
        <h2>PokéScout Dashboard</h2>
        <span id="display-email" class="user-mail">Lade...</span>
        
        <div id="status-badge" class="status-badge">Prüfe Account...</div>
        
        <div id="main-area">
            </div>

        <div id="sync-msg" class="info-blue">🔄 Synchronisiere mit Extension...</div>
    </div>

    <script>
        const EXTENSION_ID = "fbckcnpmomkfbggocjjibnjgebjkkocl";
        const token = localStorage.getItem('poketool_token');

        if (!token) {
            window.location.href = "login.html";
        } else {
            // Beim Laden der Seite Status vom Server aktualisieren
            updateUserStatus();
        }

        async function updateUserStatus() {
            try {
                // Wir holen uns die aktuellsten Daten direkt vom Server
                const res = await fetch('https://pokecardscout-api.onrender.com/login_check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
                });
                
                const data = await res.json();
                
                if (res.ok) {
                    // LocalStorage mit frischen Daten aktualisieren
                    localStorage.setItem('isPremium', data.is_premium);
                    localStorage.setItem('premiumUntil', data.premium_until);
                    renderDashboard(data.is_premium, data.premium_until, data.email);
                } else {
                    logout(); // Token ungültig
                }
            } catch (e) {
                // Fallback auf lokale Daten bei Netzwerkfehler
                renderDashboard(
                    localStorage.getItem('isPremium') === 'true',
                    localStorage.getItem('premiumUntil'),
                    "Dein Account"
                );
            }
        }

        function renderDashboard(isPremium, premiumUntil, email) {
            const statusBadge = document.getElementById('status-badge');
            const mainArea = document.getElementById('main-area');
            document.getElementById('display-email').innerText = email;

            if (isPremium && premiumUntil && new Date(premiumUntil) > new Date()) {
                // ÜBERSICHT FÜR PREMIUM NUTZER
                statusBadge.innerText = "PREMIUM ACCOUNT ✨";
                statusBadge.className = "status-badge premium-active";
                
                const dateStr = new Date(premiumUntil).toLocaleDateString('de-DE', { 
                    day: '2-digit', month: 'long', year: 'numeric' 
                });
                
                mainArea.innerHTML = `
                    <div class="info-container premium-info-box">
                        <div class="expiry-text">Abonnement aktiv bis: <b>${dateStr}</b></div>
                        <p class="info-text">Du hast vollen Zugriff auf alle TCGPlayer-Preise in der Extension.</p>
                        <button onclick="manageBilling()" class="btn-manage">Abo verwalten / Kündigen</button>
                    </div>
                `;
            } else {
                // ÜBERSICHT FÜR STANDARD NUTZER
                statusBadge.innerText = "STANDARD ACCOUNT";
                statusBadge.className = "status-badge premium-none";
                
                mainArea.innerHTML = `
                    <div class="info-container standard-info-box">
                        <p class="info-text">Aktuell nutzt du die kostenlose Version. Werde Premium-Mitglied, um unbegrenzt TCGPlayer-Preise auf Cardmarket zu sehen.</p>
                        <button id="checkoutBtn" onclick="startCheckout()" class="btn-premium">Jetzt Premium aktivieren</button>
                    </div>
                `;
            }
            checkExtension();
        }

        function checkExtension() {
            if (typeof chrome !== "undefined" && chrome.runtime && chrome.runtime.sendMessage) {
                chrome.runtime.sendMessage(EXTENSION_ID, { type: "LOGIN_SUCCESS", token: token }, (response) => {
                    const syncBox = document.getElementById('sync-msg');
                    if (!chrome.runtime.lastError) {
                        syncBox.className = "success-green";
                        syncBox.innerHTML = "✅ Extension ist bereit & synchronisiert.";
                        setTimeout(() => syncBox.style.display = 'none', 5000);
                    }
                });
            }
        }

        async function startCheckout() {
            const btn = document.getElementById('checkoutBtn');
            btn.disabled = true; btn.innerText = "Lade Stripe...";
            const res = await fetch('https://pokecardscout-api.onrender.com/create-checkout-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.url) window.location.href = data.url;
        }

        async function manageBilling() {
            const res = await fetch('https://pokecardscout-api.onrender.com/create-portal-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` }
            });
            const data = await res.json();
            if (data.url) window.location.href = data.url;
        }

        function logout() {
            localStorage.clear();
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
