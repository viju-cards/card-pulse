<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Pro - Dashboard</title>
    <style>
        :root {
            --poke-blue: #20558a;
            --poke-yellow: #ffcb05;
            --bg-beige: #ffffff; 
            --card-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-beige); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0; 
        }

        .card { 
            background: #f1efe7; 
            padding: 30px; 
            border-radius: 20px; 
            box-shadow: var(--card-shadow); 
            width: 90%; 
            max-width: 360px; /* Kompakter als vorher */
            text-align: center; 
            position: relative;
        }

        .logo-container {
            margin-bottom: 15px;
        }

        .logo-container img {
            width: 180px; /* Logo etwas prominenter */
            height: auto;
        }

        h2 { 
            color: #1a1a1a; 
            margin: 0; 
            font-size: 20px; 
            font-weight: 700;
        }

        .user-mail { 
            font-size: 13px; 
            color: #657786; 
            margin-bottom: 20px; 
            display: block; 
        }

        .status-badge { 
            display: inline-block; 
            padding: 6px 14px; 
            border-radius: 12px; 
            font-size: 12px; 
            font-weight: 700; 
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        .premium-active { background: #e6f4ea; color: #1e7e34; }
        .premium-none { background: #f1f3f5; color: #495057; }

        .info-box { 
            background: #fafafa; 
            border: 1px solid #f0f0f0; 
            padding: 20px; 
            border-radius: 16px; 
        }

        .cancel-warning { 
            color: #d93025; 
            font-size: 12px; 
            font-weight: 600;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .btn-main { 
            width: 100%; 
            padding: 14px; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 15px; 
            transition: 0.2s;
            border: none;
        }

        .btn-premium { 
            background: var(--poke-blue); 
            color: white; 
        }
        .btn-premium:hover { background: #1a446e; opacity: 0.9; }

        .btn-manage { 
            background: #f8f9fa; 
            color: #495057; 
            border: 1px solid #dee2e6;
            margin-top: 10px;
        }
        .btn-manage:hover { background: #e9ecef; }

        .logout-link {
            display: block;
            margin-top: 20px;
            font-size: 13px;
            color: #adb5bd;
            text-decoration: none;
            cursor: pointer;
        }
        .logout-link:hover { color: #d93025; }

        .expiry-text { font-size: 13px; color: #495057; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <img src="logo.png" alt="PokéScout">
    </div>

    <h2 id="display-email">Laden...</h2>
    <span class="user-mail">Dashboard</span>

    <div id="status-badge" class="status-badge">Prüfe Status...</div>

    <div id="content-area">
        </div>

    <a class="logout-link" onclick="logout()">Abmelden</a>
</div>

<script>
    const token = localStorage.getItem('poketool_token');
    if (!token) window.location.href = "login.html";

    async function init() {
        try {
            const res = await fetch('https://pokecardscout-api.onrender.com/login_check', {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`, 
                    'Content-Type': 'application/json' 
                }
            });
            const data = await res.json();
            
            if (res.ok) {
                document.getElementById('display-email').innerText = data.email;
                renderDashboard(data);
            } else { 
                logout(); 
            }
        } catch (e) {
            console.error("Fehler:", e);
        }
    }

    function renderDashboard(data) {
        const area = document.getElementById('content-area');
        const badge = document.getElementById('status-badge');

        if (data.is_premium) {
            badge.innerText = "Premium Aktiv ✨";
            badge.className = "status-badge premium-active";
            
            const dateStr = new Date(data.premium_until).toLocaleDateString('de-DE');

            area.innerHTML = `
                <div class="info-box">
                    ${data.cancel_at_period_end ? `
                        <div class="cancel-warning">
                            Abo endet am ${dateStr}
                        </div>` : `
                        <div class="expiry-text">Nächste Abrechnung: <b>${dateStr}</b></div>
                    `}
                    <button class="btn-main btn-manage" onclick="manage()">Abo verwalten</button>
                </div>
            `;
        } else {
            badge.innerText = "Standard Account";
            badge.className = "status-badge premium-none";
            area.innerHTML = `
                <div class="info-box">
                    <p style="font-size: 13px; color: #6c757d; margin-top: 0;">Upgrade für unbegrenzte Preis-Checks.</p>
                    <button class="btn-main btn-premium" onclick="checkout()">Pro freischalten</button>
                </div>
            `;
        }
    }

    async function checkout() {
        const res = await fetch('https://pokecardscout-api.onrender.com/create-checkout-session', {
            method: 'POST', 
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const d = await res.json(); 
        if (d.url) window.location.href = d.url;
    }

    async function manage() {
        const res = await fetch('https://pokecardscout-api.onrender.com/create-portal-session', {
            method: 'POST', 
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const d = await res.json(); 
        if (d.url) window.location.href = d.url;
    }

    function logout() { 
        localStorage.clear(); 
        window.location.href = "login.html"; 
    }

    init();
</script>

</body>
</html>
