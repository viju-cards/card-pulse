<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Dashboard</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f7f9; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; width: 380px; }
        .btn-premium { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; font-size: 14px; }
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 20px; font-size: 12px; background: #eee; margin-top: 10px; font-weight: 600; }
        #sync-msg { margin-top: 20px; padding: 15px; border-radius: 8px; font-size: 13px; line-height: 1.4; }
        .info-blue { background: #e7f3ff; color: #20558a; border: 1px solid #d0e7ff; }
        .error-red { background: #fff1f0; color: #d93025; border: 1px solid #ffd1cf; }
        .success-green { background: #f6ffed; color: #28a745; border: 1px solid #b7eb8f; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Willkommen bei PokéScout!</h2>
        <div id="status" class="status-badge">Prüfe Account...</div>
        
        <div id="sync-msg" class="info-blue">
            🔄 Suche installierte Erweiterung...
        </div>

        <div id="premium-area" style="display:none;">
            <p style="font-size: 14px; color: #666; margin-top: 20px;">
                Hol dir die volle Power und sehe TCGPlayer-Preise live auf Cardmarket.
            </p>
            <button onclick="startCheckout()" class="btn-premium">Premium Abo abschließen</button>
        </div>
    </div>

    <script>
        const EXTENSION_ID = "fbckcnpmomkfbggocjjibnjgebjkkocl"; // Deine spezifische ID
        const token = localStorage.getItem('userToken');
        const syncBox = document.getElementById('sync-msg');

        // 1. Check ob überhaupt eingeloggt auf Webseite
        if (!token) {
            window.location.href = "/login.html";
        } else {
            document.getElementById('status').innerText = "Eingeloggt";
            document.getElementById('status').style.background = "#e6f7ff";
            document.getElementById('status').style.color = "#1890ff";
            document.getElementById('premium-area').style.display = "block";
            
            // 2. Versuch die Extension zu kontaktieren
            checkExtension();
        }

      function checkExtension() {
    const syncBox = document.getElementById('sync-msg');
    
    if (typeof chrome !== "undefined" && chrome.runtime && chrome.runtime.sendMessage) {
        // Wir senden das Token an deine ID: fbckcnpmomkfbggocjjibnjgebjkkocl
        chrome.runtime.sendMessage(EXTENSION_ID, { type: "LOGIN_SUCCESS", token: token }, (response) => {
            
            // WICHTIG: Wenn lastError leer ist, wurde die Extension erreicht!
            if (chrome.runtime.lastError) {
                syncBox.className = "error-red";
                syncBox.innerHTML = "<b>Erweiterung nicht gefunden!</b><br>Bitte stelle sicher, dass PokéScout aktiviert ist.";
                return;
            }

            // Wenn wir hier sind, hat die Extension geantwortet. 
            // Auch wenn der Server "PAYMENT_REQUIRED" sagt, ist die Verbindung zur Extension JA ERFOLGREICH.
            syncBox.className = "success-green";
            syncBox.innerHTML = "✅ <b>Erfolgreich verbunden!</b><br>Die Extension hat dein Token erhalten.";
            
            // Verstecke die Box nach 3 Sekunden automatisch
            setTimeout(() => { syncBox.style.display = 'none'; }, 3000);
        });
    }
}

        async function startCheckout() {
            try {
                const response = await fetch('/create-checkout-session', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await response.json();
                if (data.url) window.location.href = data.url;
            } catch (e) {
                alert("Fehler beim Starten des Checkouts.");
            }
        }
    </script>
</body>
</html>
