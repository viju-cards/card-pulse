<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Dashboard</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 50px; background: #f4f7f9; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        .btn-premium { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 20px; }
        .status-badge { display: inline-block; padding: 5px 10px; border-radius: 20px; font-size: 12px; background: #eee; margin-top: 10px; }
        #sync-msg { color: #20558a; font-size: 12px; margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Willkommen bei PokéScout!</h2>
        <div id="status" class="status-badge">Prüfe Status...</div>
        
        <div id="sync-msg" style="display:none;">🔄 Synchronisiere mit Extension...</div>

        <div id="premium-area" style="display:none;">
            <p style="font-size: 14px; color: #666; margin-top: 20px;">Du hast noch kein aktives Premium-Abo.</p>
            <button onclick="startCheckout()" class="btn-premium">Premium Abo abschließen</button>
        </div>
    </div>

    <script>
        const EXTENSION_ID = "fbckcnpmomkfbggocjjibnjgebjkkocl"; // <--- HIER DEINE ID EINTRAGEN!
        const token = localStorage.getItem('userToken');

        if (!token) {
            window.location.href = "/login.html"; // Falls nicht eingeloggt
        } else {
            document.getElementById('status').innerText = "Eingeloggt";
            document.getElementById('premium-area').style.display = "block";
            
            // AUTOMATISCHE ÜBERTRAGUNG AN DIE EXTENSION
            if (typeof chrome !== "undefined" && chrome.runtime && chrome.runtime.sendMessage) {
                document.getElementById('sync-msg').style.display = "block";
                chrome.runtime.sendMessage(EXTENSION_ID, { type: "LOGIN_SUCCESS", token: token }, (response) => {
                    if (response && response.success) {
                        document.getElementById('sync-msg').innerText = "✅ Extension erfolgreich verbunden!";
                        document.getElementById('sync-msg').style.color = "green";
                    }
                });
            }
        }

        async function startCheckout() {
            const response = await fetch('/create-checkout-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token })
            });
            const data = await response.json();
            if (data.url) window.location.href = data.url;
        }
    </script>
</body>
</html>
