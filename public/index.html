<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Pro - Dashboard</title>
    <style>
        :root {
            --poke-blue: #20558a;
            --poke-yellow: #ffcb05;
            --poke-dark-blue: #1a446e;
            --bg-grad: linear-gradient(135deg, #f4f7f9 0%, #e9eff5 100%);
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg-grad); 
            display: flex; 
            justify-content: center; 
            padding-top: 60px;
            min-height: 100vh;
            margin: 0; 
        }

        .card { 
            background: white; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            border-top: 6px solid var(--poke-yellow);
            position: relative;
        }

        .btn-logout { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            color: #d93025; 
            cursor: pointer; 
            border: 1px solid #ffccc7; 
            background: white; 
            padding: 6px 12px; 
            border-radius: 8px; 
            font-size: 12px;
            font-weight: 600;
            transition: 0.2s;
        }
        .btn-logout:hover { background: #fff1f0; }

        .logo-container img {
            width: 100px;
            height: auto;
            margin-bottom: 10px;
        }

        h2 { color: var(--poke-blue); margin: 10px 0 5px 0; font-size: 24px; }
        .user-mail { font-size: 14px; color: #657786; margin-bottom: 25px; display: block; }

        .status-badge { 
            display: inline-block; 
            padding: 10px 20px; 
            border-radius: 30px; 
            font-size: 14px; 
            font-weight: 800; 
            letter-spacing: 0.5px;
            margin-bottom: 25px;
        }
        .premium-active { background: #f6ffed; color: #389e0d; border: 1px solid #b7eb8f; }
        .premium-none { background: #f0f7ff; color: #0050b3; border: 1px solid #91d5ff; }

        .info-box { 
            background: #f8fafc; 
            border: 1px solid #edf2f7; 
            padding: 24px; 
            border-radius: 16px; 
            text-align: left;
        }

        .cancel-warning { 
            background: #fff2f0; 
            color: #ff4d4f; 
            padding: 14px; 
            border-radius: 10px; 
            margin-bottom: 15px; 
            border: 1px solid #ffccc7; 
            font-size: 13px; 
            line-height: 1.4;
        }

        .btn-main { 
            width: 100%; 
            padding: 16px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 16px; 
            transition: 0.3s;
            border: none;
            margin-top: 10px;
        }

        .btn-premium { 
            background: #28a745; 
            color: white; 
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.2);
        }
        .btn-premium:hover { background: #218838; transform: translateY(-2px); }

        .btn-manage { 
            background: white; 
            color: var(--poke-blue); 
            border: 2px solid var(--poke-blue);
        }
        .btn-manage:hover { background: #f0f7ff; }

        .expiry-text { font-size: 15px; color: #4a5568; margin-bottom: 15px; }
        .expiry-text b { color: var(--poke-blue); }
    </style>
</head>
<body>

<div class="card">
    <button class="btn-logout" onclick="logout()">Abmelden</button>
    
    <div class="logo-container">
        <img src="logo.png" alt="PokéScout Logo">
    </div>

    <h2 id="display-email">Laden...</h2>
    <span class="user-mail">Dein PokéScout Account</span>

    <div id="status-badge" class="status-badge">Prüfe Status...</div>

    <div id="content-area">
        </div>
</div>

<script>
    const token = localStorage.getItem('poketool_token');
    if (!token) window.location.href = "login.html";

    async function init() {
        try {
            const res = await fetch('https://pokecardscout-api.onrender.com/login_check', {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`, 
                    'Content-Type': 'application/json' 
                }
            });
            const data = await res.json();
            
            if (res.ok) {
                document.getElementById('display-email').innerText = data.email;
                renderDashboard(data);
            } else { 
                logout(); 
            }
        } catch (e) {
            console.error("Fehler:", e);
        }
    }

    function renderDashboard(data) {
        const area = document.getElementById('content-area');
        const badge = document.getElementById('status-badge');

        if (data.is_premium) {
            badge.innerText = "PREMIUM ACCOUNT ✨";
            badge.className = "status-badge premium-active";
            
            const dateStr = new Date(data.premium_until).toLocaleDateString('de-DE', { 
                day: '2-digit', month: 'long', year: 'numeric' 
            });

            area.innerHTML = `
                <div class="info-box">
                    ${data.cancel_at_period_end ? `
                        <div class="cancel-warning">
                            ⚠️ <b>Abo gekündigt:</b> Dein Zugriff endet am ${dateStr}.
                        </div>` : ''}
                    <div class="expiry-text">Laufzeit bis: <b>${dateStr}</b></div>
                    <button class="btn-main btn-manage" onclick="manage()">Abo verwalten</button>
                </div>
            `;
        } else {
            badge.innerText = "STANDARD ACCOUNT";
            badge.className = "status-badge premium-none";
            area.innerHTML = `
                <div class="info-box">
                    <p style="font-size: 14px; color: #718096; margin-bottom: 20px;">
                        Hol dir Premium, um unbegrenzt TCGPlayer-Preise direkt auf Cardmarket zu sehen.
                    </p>
                    <button class="btn-main btn-premium" onclick="checkout()">Jetzt upgraden</button>
                </div>
            `;
        }
    }

    async function checkout() {
        const res = await fetch('https://pokecardscout-api.onrender.com/create-checkout-session', {
            method: 'POST', 
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const d = await res.json(); 
        if (d.url) window.location.href = d.url;
    }

    async function manage() {
        const res = await fetch('https://pokecardscout-api.onrender.com/create-portal-session', {
            method: 'POST', 
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const d = await res.json(); 
        if (d.url) window.location.href = d.url;
    }

    function logout() { 
        localStorage.clear(); 
        window.location.href = "login.html"; 
    }

    init();
</script>

</body>
</html>
