<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Pro - Dashboard</title>
    <style>
        :root {
            --poke-blue: #20558a;
            --bg-beige: #f1efe7; /* Exakter Farbcode aus dem Logo-Bild */
        }

        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background-color: var(--bg-beige); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            height: 100vh;
            margin: 0; 
        }

        .card { 
            background: white; 
            padding: 35px 25px; 
            border-radius: 24px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.04); 
            width: 100%; 
            max-width: 340px; /* Sehr kompakt gehalten */
            text-align: center;
        }

        .logo-container img {
            width: 160px;
            height: auto;
            margin-bottom: 15px;
        }

        h2 { 
            color: #000; 
            margin: 0; 
            font-size: 22px; 
            font-weight: 700;
            word-break: break-all;
        }

        .sub-text { 
            font-size: 13px; 
            color: #8899a6; 
            margin-bottom: 20px; 
            display: block; 
        }

        .status-badge { 
            display: inline-block; 
            padding: 8px 16px; 
            border-radius: 20px; 
            font-size: 12px; 
            font-weight: 700; 
            text-transform: uppercase;
            margin-bottom: 25px;
        }
        .premium-active { background: #eefaf2; color: #2eb85c; }
        .premium-none { background: #f8f9fa; color: #6c757d; }

        .info-box { 
            background: #f8f9fa; 
            border: 1px solid #f1f3f5; 
            padding: 20px; 
            border-radius: 18px; 
        }

        .status-msg { 
            font-size: 13px; 
            font-weight: 600;
            margin-bottom: 15px;
        }
        .cancel-warning { color: #e53e3e; }
        .active-msg { color: #4a5568; }

        .btn-main { 
            width: 100%; 
            padding: 14px; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 15px; 
            transition: 0.2s;
            border: 1px solid #dee2e6;
            background: white;
            color: var(--poke-blue);
        }
        .btn-main:hover { background: #f8fbff; border-color: var(--poke-blue); }

        .btn-upgrade {
            background: var(--poke-blue);
            color: white;
            border: none;
        }
        .btn-upgrade:hover { opacity: 0.9; }

        .logout-link {
            display: inline-block;
            margin-top: 25px;
            font-size: 14px;
            color: #adb5bd;
            text-decoration: none;
            cursor: pointer;
        }
        .logout-link:hover { color: #4a5568; }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <img src="logo.png" alt="PokéScout">
    </div>

    <h2 id="display-email">Laden...</h2>
    <span class="sub-text">Dashboard</span>

    <div id="status-badge" class="status-badge">Status wird geprüft...</div>

    <div id="content-area">
        </div>

    <a class="logout-link" onclick="logout()">Abmelden</a>
</div>

<script>
    const token = localStorage.getItem('poketool_token');
    if (!token) window.location.href = "login.html";

    async function init() {
        try {
            const res = await fetch('https://pokecardscout-api.onrender.com/login_check', {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`, 
                    'Content-Type': 'application/json' 
                }
            });
            const data = await res.json();
            
            if (res.ok) {
                document.getElementById('display-email').innerText = data.email;
                renderDashboard(data);
            } else { 
                logout(); 
            }
        } catch (e) {
            console.error("Dashboard-Fehler:", e);
        }
    }

    function renderDashboard(data) {
        const area = document.getElementById('content-area');
        const badge = document.getElementById('status-badge');

        if (data.is_premium) {
            badge.innerText = "Premium Aktiv ✨";
            badge.className = "status-badge premium-active";
            
            const dateStr = new Date(data.premium_until).toLocaleDateString('de-DE');

            area.innerHTML = `
                <div class="info-box">
                    <div class="status-msg ${data.cancel_at_period_end ? 'cancel-warning' : 'active-msg'}">
                        ${data.cancel_at_period_end ? `Abo endet am ${dateStr}` : `Verlängert sich am ${dateStr}`}
                    </div>
                    <button class="btn-main" onclick="manage()">Abo verwalten</button>
                </div>
            `;
        } else {
            badge.innerText = "Standard Account";
            badge.className = "status-badge premium-none";
            area.innerHTML = `
                <div class="info-box">
                    <p style="font-size: 13px; color: #718096; margin-top: 0; margin-bottom: 15px;">Upgrade für unbegrenzten Zugriff.</p>
                    <button class="btn-main btn-upgrade" onclick="checkout()">Pro freischalten</button>
                </div>
            `;
        }
    }

    async function checkout() {
        const res = await fetch('https://pokecardscout-api.onrender.com/create-checkout-session', {
            method: 'POST', 
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const d = await res.json(); 
        if (d.url) window.location.href = d.url;
    }

    async function manage() {
        const res = await fetch('https://pokecardscout-api.onrender.com/create-portal-session', {
            method: 'POST', 
            headers: { 'Authorization': `Bearer ${token}` }
        });
        const d = await res.json(); 
        if (d.url) window.location.href = d.url;
    }

        window.location
