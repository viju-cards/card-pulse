<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokéScout Premium - Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --poke-blue: #20558a;
            --bg-beige: #f1efe7; 
            --card-shadow: 0 15px 40px rgba(0,0,0,0.06);
            --text-dark: #121826;
            --text-muted: #64748b;
            --font-head: 'Outfit', sans-serif;
            --font-body: 'Plus Jakarta Sans', sans-serif;
        }

        body { 
            font-family: var(--font-body); 
            background-color: var(--bg-beige); 
            display: flex; 
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            margin: 0; 
            padding: 20px;
        }

        .card { 
            background: white; 
            padding: 45px 35px; 
            border-radius: 32px; 
            box-shadow: var(--card-shadow); 
            width: 100%; 
            max-width: 420px; 
            text-align: center; 
            box-sizing: border-box;
        }

        .logo-container { margin-bottom: 15px; }
        .logo-container img { width: 160px; height: auto; }

        .status-badge { 
            display: inline-block; 
            padding: 8px 16px; 
            border-radius: 100px; 
            font-size: 11px; 
            font-weight: 800; 
            text-transform: uppercase;
            letter-spacing: 0.08em;
            margin-bottom: 30px;
        }
        .premium-active { background: #e6f4ea; color: #1e7e34; }
        .premium-none { background: #f1f3f5; color: #495057; }

        h2 { 
            font-family: var(--font-head);
            color: var(--text-dark); 
            margin: 0 0 15px 0; 
            font-size: 28px; 
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .welcome-info {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 30px;
            padding: 0 5px;
        }

        .info-box { 
            background: #fcfcfc; 
            border: 1px solid #f1f5f9; 
            padding: 25px; 
            border-radius: 24px; 
        }

        .btn-main { 
            width: 100%; 
            padding: 16px; 
            border-radius: 14px; 
            cursor: pointer; 
            font-family: var(--font-body);
            font-weight: 700; 
            font-size: 15px; 
            transition: all 0.2s;
            border: none;
            box-sizing: border-box;
        }

        .btn-premium { background: #000000; color: white; }
        .btn-manage { background: white; color: #121826; border: 1px solid #e2e8f0; }

        .logout-link {
            display: inline-block;
            margin-top: 30px;
            font-size: 14px;
            color: #94a3b8;
            text-decoration: none;
            cursor: pointer;
            font-weight: 500;
        }

        .expiry-text { font-size: 14px; color: #475569; margin-bottom: 15px; font-weight: 500; }
        .expiry-text b { color: var(--text-dark); }
    </style>
</head>
<body>

<div class="card">
    <div class="logo-container">
        <img src="logo.png" alt="PokéScout">
    </div>

    <div id="status-badge" class="status-badge">Verbinde zum Server...</div>

    <h2 id="welcome-title">Einen Moment bitte</h2>

    <div class="welcome-info" id="welcome-text">
        Wir laden dein Profil, einen kleinen Augeblick bitte.
    </div>

    <div id="content-area"></div>

    <a class="logout-link" onclick="logout()">Abmelden</a>
</div>

<script>
    const token = localStorage.getItem('poketool_token');
    const apiBase = 'https://pokecardscout-api.onrender.com';
    const POKESCOUT_EXTENSION_ID = "fbckcnpmomkfbggocjjibnjgebjkkocl";

    if (!token) window.location.href = "login.html";

    function syncWithExtension(t) {
        if (typeof chrome !== 'undefined' && chrome.runtime && chrome.runtime.sendMessage) {
            chrome.runtime.sendMessage(POKESCOUT_EXTENSION_ID, {
                type: "LOGIN_SUCCESS",
                token: t
            }, (response) => {
                console.log("Extension Sync-Versuch...");
            });
        }
    }

    async function init() {
        try {
            console.log("Starte Login-Check...");
            const res = await fetch(`${apiBase}/login_check`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json' 
                }
            });
            
            if (res.ok) {
                const data = await res.json();
                console.log("Server Check OK:", data);
                document.getElementById('welcome-title').innerText = "Schön, dass du da bist!";
                document.getElementById('welcome-text').innerText = "Mit dem Premium-Abo siehst du die TCGplayer-Preise direkt auf Cardmarket.";
                renderDashboard(data);
                syncWithExtension(token);
            } else if (res.status === 401 || res.status === 403) {
                console.warn("Token ungültig.");
                logout();
            } else {
                throw new Error("Server antwortet nicht korrekt");
            }
        } catch (e) {
            console.error("Init Error:", e);
            document.getElementById('status-badge').innerText = "Server schläft...";
            // Wir loggen NICHT aus bei einem Netzwerkfehler, damit der User nicht in der Schleife landet
            setTimeout(init, 5000); // Versuche es in 5 Sek erneut
        }
    }

    function renderDashboard(data) {
        const area = document.getElementById('content-area');
        const badge = document.getElementById('status-badge');

       if (data.is_premium) {
            badge.innerText = "Premium Aktiv ✨";
            badge.className = "status-badge premium-active";
            const dateStr = new Date(data.premium_until).toLocaleDateString('de-DE');
            area.innerHTML = `
                <div class="info-box">
                    ${data.cancel_at_period_end ? `
                        <div class="cancel-warning">Abo gekündigt, endet am ${dateStr}</div>` : `
                        <div class="expiry-text">Nächste Abrechnung: <b>${dateStr}</b></div>
                    `}
                    <button class="btn-main btn-manage" onclick="manage()">Abo verwalten</button>
                </div>`;
        } else {
            badge.innerText = "Standard Account";
            badge.className = "status-badge premium-none";
            area.innerHTML = `
                <div class="info-box">
                    <button class="btn-main btn-premium" onclick="checkout()">Premium freischalten</button>
                </div>`;
        }
    }

    async function checkout() {
        try {
            const res = await fetch(`${apiBase}/create-checkout-session`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            });
            const d = await res.json(); 
            if (d.url) window.location.href = d.url;
        } catch (e) { alert("Checkout zurzeit nicht möglich. Bitte Seite neu laden."); }
    }

    async function manage() {
        try {
            const res = await fetch(`${apiBase}/create-portal-session`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: token })
            });
            const d = await res.json(); 
            if (d.url) window.location.href = d.url;
        } catch(e) { console.error(e); }
    }

    function logout() { 
        localStorage.clear(); 
        window.location.href = "login.html"; 
    }
    
    init();
</script>
</body>
</html>
