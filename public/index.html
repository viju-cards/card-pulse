<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CardPulse – Coming Soon</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&family=DM+Mono&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07070d;--surface:#0f0f1a;--border:rgba(108,99,255,0.15);--accent:#6c63ff;--accent-dim:rgba(108,99,255,0.12);--text:#e8e8f0;--muted:#6b6b80}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
  body::before{content:'';position:fixed;top:50%;left:50%;transform:translate(-50%,-60%);width:700px;height:500px;background:radial-gradient(ellipse,rgba(108,99,255,0.12) 0%,transparent 70%);pointer-events:none}
  .container{text-align:center;padding:40px 24px;max-width:520px;position:relative;z-index:1}
  .logo{font-family:'Syne',sans-serif;font-size:28px;font-weight:800;color:#fff;margin-bottom:48px;display:block}
  .logo span{color:var(--accent)}
  .icon-wrap{width:80px;height:80px;border-radius:22px;background:var(--accent-dim);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;margin:0 auto 32px}
  .pulse-icon{width:40px;height:40px}
  .pulse-icon svg{width:40px;height:40px}
  .pulse-line{stroke-dasharray:120;stroke-dashoffset:120;animation:draw 2s ease infinite}
  @keyframes draw{0%{stroke-dashoffset:120;opacity:.3}50%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:-120;opacity:.3}}
  h1{font-family:'Syne',sans-serif;font-size:clamp(28px,5vw,42px);font-weight:800;letter-spacing:-1px;line-height:1.1;margin-bottom:16px}
  h1 em{color:var(--accent);font-style:normal}
  .sub{font-size:16px;color:var(--muted);line-height:1.7;margin-bottom:40px;font-weight:300}
  .status-row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:48px}
  .pill{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:99px;background:var(--surface);border:1px solid var(--border);font-size:13px;color:var(--muted)}
  .pill-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
  .green{background:#22c55e}
  .yellow{background:#f59e0b;animation:blink 1.5s ease infinite}
  .gray{background:#4b5563}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
  .pill.done{border-color:rgba(34,197,94,0.3)}
  .pill.active{border-color:rgba(245,158,11,0.3)}
  .note{font-size:12px;color:var(--muted);opacity:.5;font-family:'DM Mono',monospace;letter-spacing:.5px}
</style>
</head>
<body>
<div class="container">
  <span class="logo">card<span>pulse</span></span>
  <div class="icon-wrap">
    <div class="pulse-icon">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M30 8 A14 14 0 1 0 30 32" stroke="#6c63ff" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.5"/>
        <polyline class="pulse-line" points="6,20 11,20 14,12 19,28 23,16 28,20 34,20" stroke="#6c63ff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
  <h1>We're getting<br>ready to <em>launch.</em></h1>
  <p class="sub">CardPulse is almost here — TCGPlayer prices directly on Cardmarket, for the whole of Europe.</p>
  <div class="status-row">
    <div class="pill done"><span class="pill-dot green"></span> Backend & API</div>
    <div class="pill done"><span class="pill-dot green"></span> Database</div>
    <div class="pill active"><span class="pill-dot yellow"></span> Website going live</div>
    <div class="pill active"><span class="pill-dot yellow"></span> Chrome Extension</div>
    <div class="pill"><span class="pill-dot gray"></span> Public launch</div>
  </div>
  <p class="note">card-pulse.com &nbsp;·&nbsp; coming soon</p>
</div>
</body>
</html>
