<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account – CardPulse</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/cardpulse-ui.css">
</head>
<body>
<nav>
  <div class="cp-nav-in">
    <a href="/" class="logo">card<span>pulse</span></a>
    <div class="nav-links"></div>
  </div>
</nav>

<main class="cp-main center">
  <div class="cp-form">
    <span class="sec-eye" data-i18n="register_eyebrow">Create account</span>
    <h1 class="form-h1" data-i18n="register_h1">Join the collectors.</h1>
    <p class="form-sub">
      <span data-i18n="login_no_account">Already have an account?</span>
      <a href="/login.html" data-i18n="login_btn"> Sign in</a>
    </p>

    <div class="field">
      <label data-i18n="login_email">Email</label>
      <input type="email" id="email" autocomplete="email">
    </div>
    <div class="field">
      <label data-i18n="register_pw">Password</label>
      <input type="password" id="password" autocomplete="new-password">
      <p class="hint" data-i18n="register_pw_hint">Min. 8 characters</p>
    </div>
    <div class="field">
      <label data-i18n="register_pw2">Repeat password</label>
      <input type="password" id="password2" autocomplete="new-password">
    </div>
    <button class="btn btn-solid btn-block" id="registerBtn" data-i18n="register_btn">Create account</button>
    <div class="msg" id="msg"></div>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/shared.js"></script>
<script>
const API='';
const EXT_ID='gidmncphcliponfkhnamnglljbphdeoe';
async function doRegister(){
  const email=document.getElementById('email').value.trim();
  const pw=document.getElementById('password').value;
  const pw2=document.getElementById('password2').value;
  const btn=document.getElementById('registerBtn');
  const msg=document.getElementById('msg');
  msg.className='msg';
  if(!email||!pw||!pw2){msg.textContent=window.i18n?.t('register_error_fields')||'Please fill all fields.';msg.className='msg error';return}
  if(pw.length<8){msg.textContent=window.i18n?.t('register_error_short')||'Password too short.';msg.className='msg error';return}
  if(pw!==pw2){msg.textContent=window.i18n?.t('register_error_match')||'Passwords do not match.';msg.className='msg error';return}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>...';
  try{
    const res=await fetch(`${API}/auth/register`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw})});
    const data=await res.json();
    if(!res.ok){msg.textContent=data.error||'Registration failed.';msg.className='msg error';return}
    localStorage.setItem('cp_token',data.token);
    try{chrome.runtime.sendMessage(EXT_ID,{type:'LOGIN_SUCCESS',token:data.token})}catch(e){}
    window.location.href='/dashboard.html';
  }catch(e){msg.textContent=window.i18n?.t('login_error_connection')||'Connection error.';msg.className='msg error'}
  finally{btn.disabled=false;btn.textContent=window.i18n?.t('register_btn')||'Create account'}
}
document.getElementById('registerBtn').onclick=doRegister;
document.getElementById('password2').addEventListener('keydown',e=>{if(e.key==='Enter')doRegister()});
</script>
</body>
</html>
