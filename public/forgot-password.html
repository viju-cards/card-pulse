<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password – CardPulse</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/cardpulse-ui.css">
</head>
<body>
<nav>
  <div class="cp-nav-in">
    <a href="/" class="logo">card<span>pulse</span></a>
    <div class="nav-links"></div>
  </div>
</nav>

<main class="cp-main center">
  <div class="cp-form">
    <span class="sec-eye" data-i18n="forgot_title">Forgot password</span>
    <h1 class="form-h1" data-i18n="forgot_h1_short">Reset password.</h1>
    <p class="form-sub" data-i18n="forgot_sub">Enter your email and we'll send you a reset link.</p>

    <div class="field">
      <label data-i18n="login_email">Email</label>
      <input type="email" id="email" autocomplete="email">
    </div>
    <button class="btn btn-solid btn-block" id="submitBtn" data-i18n="forgot_btn">Send reset link</button>
    <div class="msg" id="msg"></div>
    <div style="text-align:center;margin-top:24px">
      <a href="/login.html" class="link" data-i18n="forgot_back">← Back to login</a>
    </div>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/shared.js"></script>
<script>
document.getElementById('submitBtn').addEventListener('click', async function() {
  var email = document.getElementById('email').value.trim();
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  msg.className = 'msg';
  if (!email) { msg.textContent = window.i18n?.t('login_error_fields') || 'Please enter your email.'; msg.className = 'msg error'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>...';
  try {
    await fetch('/auth/forgot-password', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({email}) });
    msg.textContent = window.i18n?.t('forgot_success') || 'Check your inbox!';
    msg.className = 'msg success';
    document.getElementById('email').value = '';
  } catch(e) { msg.textContent = 'Error. Please try again.'; msg.className = 'msg error'; }
  finally { btn.disabled = false; btn.textContent = window.i18n?.t('forgot_btn') || 'Send reset link'; }
});
document.getElementById('email').addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('submitBtn').click(); });
</script>
</body>
</html>
