<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password – CardPulse</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700;800;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07070d;--surface:#0f0f1a;--border:rgba(108,99,255,0.15);--accent:#6c63ff;--text:#e8e8f0;--muted:#6b6b80;--error:#ef4444;--green:#22c55e}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}
  nav{display:flex;justify-content:space-between;align-items:center;padding:24px 48px;border-bottom:1px solid var(--border)}
  .logo{font-family:'Cabinet Grotesk',sans-serif;font-size:20px;font-weight:800;text-decoration:none;color:#fff}
  .logo span{color:var(--accent)}
  .nav-links{display:flex;gap:8px;align-items:center}
  .main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:48px;width:100%;max-width:420px}
  h1{font-family:'Cabinet Grotesk',sans-serif;font-size:28px;font-weight:800;margin-bottom:8px}
  .subtitle{color:var(--muted);font-size:14px;margin-bottom:36px;line-height:1.6}
  .field{margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px}
  input{width:100%;padding:14px 16px;background:#0a0a15;border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;transition:.2s;outline:none}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,0.12)}
  .btn{width:100%;padding:15px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:.2s;margin-top:8px}
  .btn:hover{opacity:.85}.btn:disabled{opacity:.5;cursor:not-allowed}
  .msg{padding:12px 16px;border-radius:10px;font-size:13px;margin-top:16px;display:none;line-height:1.5}
  .msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--error);display:block}
  .msg.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--green);display:block}
  .divider{text-align:center;color:var(--muted);font-size:13px;margin:24px 0}
  .link{color:var(--accent);text-decoration:none;font-weight:500}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:480px){nav{padding:14px 16px}.card{padding:28px 20px}}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">card<span>pulse</span></a>
  <div class="nav-links"></div>
</nav>
<div class="main">
  <div class="card">
    <h1 data-i18n="forgot_title">Forgot password?</h1>
    <p class="subtitle" data-i18n="forgot_sub">Enter your email and we'll send you a reset link.</p>
    <div class="field">
      <label data-i18n="login_email">Email</label>
      <input type="email" id="email" data-i18n-placeholder="login_email" autocomplete="email">
    </div>
    <button class="btn" id="submitBtn" data-i18n="forgot_btn">Send reset link</button>
    <div class="msg" id="msg"></div>
    <div class="divider"><a href="/login.html" class="link" data-i18n="forgot_back">← Back to login</a></div>
  </div>
</div>
<script src="/i18n.js"></script>
<script src="/shared.js"></script>
<script>
document.getElementById('submitBtn').addEventListener('click', async function() {
  var email = document.getElementById('email').value.trim();
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  msg.className = 'msg';
  if (!email) { msg.textContent = window.i18n.t('login_error_fields'); msg.className = 'msg error'; return; }
  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>' + window.i18n.t('forgot_sending');
  try {
    await fetch('/auth/forgot-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email })
    });
    // Always show success (server doesn't reveal if email exists)
    msg.textContent = window.i18n.t('forgot_success');
    msg.className = 'msg success';
    document.getElementById('email').value = '';
  } catch(e) {
    msg.textContent = window.i18n.t('login_error_connection');
    msg.className = 'msg error';
  } finally {
    btn.disabled = false;
    btn.textContent = window.i18n.t('forgot_btn');
  }
});
document.getElementById('email').addEventListener('keydown', function(e) { if(e.key==='Enter') document.getElementById('submitBtn').click(); });
</script>
</body>
</html>
