<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report missing card – CardPulse</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/cardpulse-ui.css">
</head>
<body>
<nav>
  <div class="cp-nav-in">
    <a href="/" class="logo">card<span>pulse</span></a>
    <div class="nav-links"></div>
  </div>
</nav>

<main class="cp-main center">
  <div class="cp-form" style="max-width:520px">
    <span class="sec-eye" data-i18n="suggest_eyebrow">Missing data</span>
    <h1 class="form-h1" data-i18n="suggest_h1">Report missing card.</h1>
    <p class="form-sub" data-i18n="suggest_sub">Let us know and we'll add it asap.</p>
    <div class="field">
      <label><span data-i18n="suggest_url_label">Cardmarket URL</span> <span style="color:var(--accent)">*</span></label>
      <input type="url" id="url" placeholder="https://www.cardmarket.com/...">
      <p class="hint" data-i18n="suggest_url_hint">Link to the card or set on Cardmarket.</p>
    </div>
    <div class="field">
      <label><span data-i18n="suggest_note_label">Additional info</span> <span style="color:var(--mut);font-size:10px" data-i18n="suggest_note_opt">(optional)</span></label>
      <textarea id="note" rows="4"></textarea>
    </div>
    <button class="btn btn-solid btn-block" id="submitBtn" data-i18n="suggest_btn">Send report</button>
    <div class="msg" id="msg"></div>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/shared.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var prefill = params.get('url');
if (prefill) document.getElementById('url').value = decodeURIComponent(prefill);
document.getElementById('submitBtn').addEventListener('click', async function() {
  var url = document.getElementById('url').value.trim();
  var note = document.getElementById('note').value.trim();
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  msg.className = 'msg';
  if (!url) { msg.textContent = window.i18n?.t('suggest_err_url') || 'Please enter a URL.'; msg.className = 'msg error'; return; }
  if (!url.includes('cardmarket.com')) { msg.textContent = window.i18n?.t('suggest_err_valid') || 'Please enter a valid Cardmarket URL.'; msg.className = 'msg error'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>...';
  try {
    var res = await fetch('/suggest', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({url, note}) });
    if (res.ok) { msg.textContent = window.i18n?.t('suggest_success') || 'Thanks! We received your report.'; msg.className = 'msg success'; document.getElementById('url').value = ''; document.getElementById('note').value = ''; }
    else throw new Error();
  } catch { msg.textContent = window.i18n?.t('suggest_err_send') || 'Error sending.'; msg.className = 'msg error'; }
  finally { btn.disabled = false; btn.textContent = window.i18n?.t('suggest_btn') || 'Send report'; }
});
</script>
</body>
</html>
