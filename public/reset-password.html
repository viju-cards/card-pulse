<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password – CardPulse</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Barlow+Condensed:wght@700;800;900&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090f;--surface:#0f0f1c;--card:#13131f;--border:rgba(255,255,255,0.06);--accent:#6c63ff;--yellow:#ffd700;--teal:#00d4aa;--text:#e8e8f0;--muted:#5a5a78;--red:#ef4444;--green:#22c55e}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:"DM Sans",sans-serif;min-height:100vh;display:flex;flex-direction:column}
body::after{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(108,99,255,0.1) 1px,transparent 1px);background-size:28px 28px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 20%,transparent 100%)}
nav{position:sticky;top:0;z-index:100;display:flex;justify-content:space-between;align-items:center;padding:14px 48px;background:rgba(9,9,15,0.9);border-bottom:1px solid var(--border);backdrop-filter:blur(20px)}
.logo{font-family:"Press Start 2P",monospace;font-size:11px;color:var(--text);text-decoration:none;letter-spacing:1px;line-height:1.6}
.logo span{color:var(--accent)}
.nav-links{display:flex;gap:8px;align-items:center}
.main{flex:1;position:relative;z-index:1;padding:60px 48px}
.eyebrow{font-family:"Press Start 2P",monospace;font-size:8px;color:var(--accent);letter-spacing:2px;margin-bottom:20px;display:block}
.eyebrow::before{content:"> "}
h1{font-family:"Barlow Condensed",sans-serif;font-size:clamp(40px,5vw,72px);font-weight:900;text-transform:uppercase;letter-spacing:-1px;line-height:.95;margin-bottom:16px}
h2{font-family:"Barlow Condensed",sans-serif;font-size:clamp(28px,4vw,48px);font-weight:800;text-transform:uppercase;letter-spacing:-.5px;margin-bottom:16px}
h3{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:800;text-transform:uppercase;margin-bottom:12px}
p{font-family:"DM Mono",monospace;font-size:13px;color:var(--muted);line-height:1.8}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:28px}
label{display:block;font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
input,textarea,select{width:100%;padding:13px 16px;background:rgba(0,0,0,0.5);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:"DM Mono",monospace;font-size:13px;outline:none;transition:.2s;resize:vertical}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,0.1)}
select option{background:var(--card)}
.btn{width:100%;padding:14px;background:var(--accent);border:none;border-radius:8px;color:#fff;font-family:"DM Mono",monospace;font-size:13px;font-weight:500;cursor:pointer;transition:.2s}
.btn:hover{opacity:.85}.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.outline{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn.outline:hover{border-color:var(--accent);color:var(--text)}
.btn.danger{background:transparent;border:1px solid rgba(239,68,68,0.3);color:var(--red)}
.btn.danger:hover{background:rgba(239,68,68,0.08)}
.msg{padding:12px 16px;border-radius:8px;font-size:12px;font-family:"DM Mono",monospace;margin-top:14px;display:none;line-height:1.6}
.msg.error{background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);color:var(--red);display:block}
.msg.success{background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);color:var(--green);display:block}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.hint{font-family:"DM Mono",monospace;font-size:11px;color:var(--muted);margin-top:5px}
.link{color:var(--accent);font-family:"DM Mono",monospace;font-size:12px;text-decoration:none}
.link:hover{text-decoration:underline}
.wrap{max-width:400px;margin:0 auto}
@media(max-width:768px){nav{padding:10px 16px}.main{padding:40px 20px}h1{font-size:40px}}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">card<span>pulse</span></a>
  <div class="nav-links"></div>
</nav>

<div class="main" style="display:flex;align-items:center;justify-content:center">
  <div class="wrap" id="formWrap">
    <span class="eyebrow" data-i18n="reset_title">New password</span>
    <h1 data-i18n="reset_h1_short">New<br>password.</h1>
    <p style="margin-bottom:32px" data-i18n="reset_sub">Choose a strong new password.</p>
    <div style="margin-bottom:18px">
      <label data-i18n="register_pw">Password</label>
      <input type="password" id="password" placeholder="••••••••">
      <p class="hint" data-i18n="register_pw_hint">Min. 8 characters</p>
    </div>
    <div style="margin-bottom:18px">
      <label data-i18n="register_pw2">Repeat password</label>
      <input type="password" id="password2" placeholder="••••••••">
    </div>
    <button class="btn" id="submitBtn" data-i18n="reset_btn">Set new password</button>
    <div class="msg" id="msg"></div>
  </div>
  <div id="invalidWrap" style="display:none;text-align:center;max-width:400px;margin:0 auto">
    <span class="eyebrow">Error</span>
    <h1>Link<br>expired.</h1>
    <p style="margin-bottom:32px" data-i18n="reset_invalid">This reset link is invalid or expired.</p>
    <a href="/forgot-password.html" class="btn" style="display:block;text-decoration:none;text-align:center" data-i18n="reset_request_new">Request new link</a>
  </div>
</div>

<script src="/i18n.js"></script>
<script src="/shared.js"></script>
<script>
var token = new URLSearchParams(window.location.search).get('token');
if (!token) { document.getElementById('formWrap').style.display='none'; document.getElementById('invalidWrap').style.display='block'; }
document.getElementById('submitBtn')?.addEventListener('click', async function() {
  var pw = document.getElementById('password').value;
  var pw2 = document.getElementById('password2').value;
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  msg.className = 'msg';
  if (!pw || !pw2) { msg.textContent = 'Please fill all fields.'; msg.className = 'msg error'; return; }
  if (pw.length < 8) { msg.textContent = 'Password too short.'; msg.className = 'msg error'; return; }
  if (pw !== pw2) { msg.textContent = 'Passwords do not match.'; msg.className = 'msg error'; return; }
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>...';
  try {
    var res = await fetch('/auth/reset-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({token, password: pw}) });
    var data = await res.json();
    if (!res.ok) { if (data.error === 'INVALID_TOKEN') { document.getElementById('formWrap').style.display='none'; document.getElementById('invalidWrap').style.display='block'; } else { msg.textContent = data.error || 'Error.'; msg.className = 'msg error'; } return; }
    msg.textContent = window.i18n?.t('reset_success') || 'Password changed! Redirecting...';
    msg.className = 'msg success';
    setTimeout(() => window.location.href = '/login.html', 2000);
  } catch(e) { msg.textContent = 'Connection error.'; msg.className = 'msg error'; }
  finally { btn.disabled = false; btn.textContent = window.i18n?.t('reset_btn') || 'Set new password'; }
});
</script></body></html>
