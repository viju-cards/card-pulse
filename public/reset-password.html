<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password – CardPulse</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cabinet+Grotesk:wght@400;500;700;800;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#07070d;--surface:#0f0f1a;--border:rgba(108,99,255,0.15);--accent:#6c63ff;--text:#e8e8f0;--muted:#6b6b80;--error:#ef4444;--green:#22c55e}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column}
  nav{display:flex;justify-content:space-between;align-items:center;padding:24px 48px;border-bottom:1px solid var(--border)}
  .logo{font-family:'Cabinet Grotesk',sans-serif;font-size:20px;font-weight:800;text-decoration:none;color:#fff}
  .logo span{color:var(--accent)}
  .nav-links{display:flex;gap:8px;align-items:center}
  .main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:48px;width:100%;max-width:420px}
  h1{font-family:'Cabinet Grotesk',sans-serif;font-size:28px;font-weight:800;margin-bottom:8px}
  .subtitle{color:var(--muted);font-size:14px;margin-bottom:36px}
  .field{margin-bottom:18px}
  label{display:block;font-size:13px;font-weight:500;color:var(--muted);margin-bottom:8px}
  input{width:100%;padding:14px 16px;background:#0a0a15;border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;transition:.2s;outline:none}
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(108,99,255,0.12)}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .btn{width:100%;padding:15px;background:var(--accent);border:none;border-radius:12px;color:#fff;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;cursor:pointer;transition:.2s;margin-top:8px}
  .btn:hover{opacity:.85}.btn:disabled{opacity:.5;cursor:not-allowed}
  .msg{padding:12px 16px;border-radius:10px;font-size:13px;margin-top:16px;display:none;line-height:1.5}
  .msg.error{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);color:var(--error);display:block}
  .msg.success{background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.3);color:var(--green);display:block}
  .invalid{text-align:center;padding:40px 0}
  .invalid p{color:var(--muted);margin-bottom:20px}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:8px}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media(max-width:480px){nav{padding:14px 16px}.card{padding:28px 20px}}
</style>
</head>
<body>
<nav>
  <a href="/" class="logo">card<span>pulse</span></a>
  <div class="nav-links"></div>
</nav>
<div class="main">
  <div class="card">
    <div id="formWrap">
      <h1 data-i18n="reset_title">Set new password</h1>
      <p class="subtitle" data-i18n="reset_sub">Choose a new password for your account.</p>
      <div class="field">
        <label data-i18n="register_pw">Password</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="new-password">
        <p class="hint" data-i18n="register_pw_hint">Minimum 8 characters</p>
      </div>
      <div class="field">
        <label data-i18n="register_pw2">Repeat password</label>
        <input type="password" id="password2" placeholder="••••••••" autocomplete="new-password">
      </div>
      <button class="btn" id="submitBtn" data-i18n="reset_btn">Set new password</button>
      <div class="msg" id="msg"></div>
    </div>
    <div class="invalid" id="invalidWrap" style="display:none">
      <p data-i18n="reset_invalid">This reset link is invalid or has expired.</p>
      <a href="/forgot-password.html" class="btn" style="display:inline-block;text-decoration:none;padding:14px 24px;width:auto" data-i18n="reset_request_new">Request new link</a>
    </div>
  </div>
</div>
<script src="/i18n.js"></script>
<script src="/shared.js"></script>
<script>
var token = new URLSearchParams(window.location.search).get('token');
if (!token) {
  document.getElementById('formWrap').style.display = 'none';
  document.getElementById('invalidWrap').style.display = 'block';
}

document.getElementById('submitBtn').addEventListener('click', async function() {
  var password = document.getElementById('password').value;
  var password2 = document.getElementById('password2').value;
  var btn = document.getElementById('submitBtn');
  var msg = document.getElementById('msg');
  msg.className = 'msg';

  if (!password || !password2) { msg.textContent = window.i18n.t('register_error_fields'); msg.className = 'msg error'; return; }
  if (password.length < 8) { msg.textContent = window.i18n.t('register_error_short'); msg.className = 'msg error'; return; }
  if (password !== password2) { msg.textContent = window.i18n.t('register_error_match'); msg.className = 'msg error'; return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spin"></span>' + window.i18n.t('reset_saving');

  try {
    var res = await fetch('/auth/reset-password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token: token, password: password })
    });
    var data = await res.json();
    if (!res.ok) {
      if (data.error === 'INVALID_TOKEN') {
        document.getElementById('formWrap').style.display = 'none';
        document.getElementById('invalidWrap').style.display = 'block';
      } else {
        msg.textContent = data.error || window.i18n.t('login_error_connection');
        msg.className = 'msg error';
      }
      return;
    }
    msg.textContent = window.i18n.t('reset_success');
    msg.className = 'msg success';
    setTimeout(function() { window.location.href = '/login.html'; }, 2000);
  } catch(e) {
    msg.textContent = window.i18n.t('login_error_connection');
    msg.className = 'msg error';
  } finally {
    btn.disabled = false;
    btn.textContent = window.i18n.t('reset_btn');
  }
});
</script>
</body>
</html>
