<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta http-equiv="Content-Language" content="en">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Enterprise – CardPulse</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/cardpulse-ui.css">
</head>
<body>
<nav>
  <div class="cp-nav-in">
    <a href="/" class="logo">card<span>pulse</span></a>
    <div class="nav-links">
      <a href="/">Home</a>
    </div>
  </div>
</nav>

<main class="cp-main center">
  <div class="cp-form" style="max-width:560px">
    <span class="sec-eye" data-i18n="enterprise_label">Enterprise</span>
    <h1 class="form-h1" data-i18n="enterprise_h3_short">Custom quote.</h1>
    <p class="form-sub" data-i18n="enterprise_form_sub">Tell us about your needs and we'll get back to you.</p>
    <div class="card">
      <div class="row" style="margin-bottom:18px">
        <div>
          <label><span data-i18n="enterprise_firstname">First name</span> <span style="color:var(--accent)">*</span></label>
          <input type="text" id="firstname">
        </div>
        <div>
          <label><span data-i18n="enterprise_lastname">Last name</span> <span style="color:var(--accent)">*</span></label>
          <input type="text" id="lastname">
        </div>
      </div>
      <div class="field">
        <label><span data-i18n="enterprise_email">Email</span> <span style="color:var(--accent)">*</span></label>
        <input type="email" id="email">
      </div>
      <div class="field">
        <label><span data-i18n="enterprise_requests">Desired requests/month</span> <span style="color:var(--accent)">*</span></label>
        <select id="requests">
          <option value="">— Select —</option>
          <option>10.000</option><option>25.000</option><option>50.000</option>
          <option>100.000</option><option>250.000</option><option>500.000+</option>
        </select>
      </div>
      <div class="field" style="margin-bottom:24px">
        <label><span data-i18n="enterprise_note">Additional info</span> <span style="color:var(--mut);font-size:10px" data-i18n="suggest_note_opt">(optional)</span></label>
        <textarea id="note" rows="4"></textarea>
      </div>
      <button class="btn btn-solid btn-block" id="submitBtn" data-i18n="enterprise_send">Send request</button>
      <div class="msg" id="msg"></div>
    </div>
  </div>
</main>

<script src="/i18n.js"></script>
<script src="/shared.js"></script>
<script>
document.getElementById('submitBtn').addEventListener('click', async function() {
  var fn=document.getElementById('firstname').value.trim(), ln=document.getElementById('lastname').value.trim();
  var email=document.getElementById('email').value.trim(), req=document.getElementById('requests').value;
  var note=document.getElementById('note').value.trim();
  var btn=document.getElementById('submitBtn'), msg=document.getElementById('msg');
  msg.className='msg';
  if(!fn||!ln||!email||!req){msg.textContent=window.i18n?.t('register_error_fields')||'Please fill all required fields.';msg.className='msg error';return}
  btn.disabled=true;btn.innerHTML='<span class="spin"></span>...';
  try{
    var res=await fetch('/enterprise-contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstname:fn,lastname:ln,email,requests:req,note})});
    if(res.ok){msg.textContent=window.i18n?.t('enterprise_success')||'Thanks! We will get back to you.';msg.className='msg success';}
    else throw new Error();
  }catch{msg.textContent=window.i18n?.t('suggest_err_send')||'Error.';msg.className='msg error';}
  finally{btn.disabled=false;btn.textContent=window.i18n?.t('enterprise_send')||'Send request';}
});
</script>
</body>
</html>
