<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { width: 250px; padding: 15px; font-family: sans-serif; }
        h3 { margin-top: 0; color: #333; }
        input { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #0070f3; color: white; border: none; border-radius: 4px; cursor: pointer; }
        #status { font-size: 12px; margin-top: 10px; color: #666; }
    </style>
</head>
<body>
    <h3>PokeCardScout Login</h3>
    <input type="email" id="email" placeholder="E-Mail">
    <input type="password" id="password" placeholder="Passwort">
    <button id="loginBtn">Einloggen</button>
    <div id="status"></div>

    <script src="popup.js"></script>
</body>
</html>
